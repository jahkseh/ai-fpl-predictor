<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile · AI FPL Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1220;
            --surface: #111827;
            --surface-raised: #141e30;
            --surface-soft: #162033;
            --border: #243047;
            --border-soft: rgba(148, 163, 184, .14);
            --text: #e5e7eb;
            --text-muted: #94a3b8;
            --text-soft: #b8c3d3;
            --accent: #27d17f;
            --accent-hover: #20b86d;
            --hero: #0f172a;
            --header: #0f172a;
            --footer: #0f172a;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(39, 209, 127, .08), transparent 34%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        header {
            background: rgba(15, 23, 42, .96);
            color: white;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        nav a {
            color: #dbe3ee;
            text-decoration: none;
            font-size: 15px;
            transition: color .2s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        .theme-toggle {
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 20px;
            background: transparent;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, .06);
            border-color: var(--accent);
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 42px 20px 80px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .02em;
            transition: color .2s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .profile-shell {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .22);
        }

        .profile-hero {
            position: relative;
            min-height: 310px;
            padding: 42px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            align-items: center;
            gap: 42px;
            overflow: hidden;
            background:
                radial-gradient(circle at 82% 50%, rgba(39, 209, 127, .13), transparent 28%),
                linear-gradient(135deg, #0f172a 0%, #101a2c 55%, #0d1727 100%);
            color: white;
        }

        .profile-hero::before {
            content: "";
            position: absolute;
            inset: 24px 38% 24px 38px;
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 18px;
            background:
                linear-gradient(
                    to right,
                    transparent 49.8%,
                    rgba(255, 255, 255, .05) 50%,
                    transparent 50.2%
                );
            pointer-events: none;
        }

        .profile-hero::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            left: 46%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hero-copy,
        .hero-projection {
            position: relative;
            z-index: 1;
        }

        .profile-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            color: #aebbb5;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .11em;
            text-transform: uppercase;
        }

        .profile-kicker::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 5px rgba(39, 209, 127, .08);
        }

        .player-kit {
            width: 118px;
            height: 118px;
            margin: 4px 0 22px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .10);
            border-radius: 22px;
            background: rgba(255, 255, 255, .035);
        }

        .player-kit svg {
            width: 78px;
            height: 78px;
        }

        .player-kit .shirt {
            fill: var(--accent);
            stroke: rgba(255, 255, 255, .65);
            stroke-width: 1.4;
            stroke-linejoin: round;
        }

        .player-kit .shirt-detail {
            fill: none;
            stroke: rgba(15, 23, 42, .7);
            stroke-width: 1.8;
            stroke-linecap: round;
        }

        .player-kit .shirt-mark {
            fill: #0f172a;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: .04em;
        }

        .model-graphic {
            width: 190px;
            height: 120px;
            display: block;
            margin-top: 22px;
            opacity: .95;
        }

        .model-graphic .line {
            fill: none;
            stroke: rgba(148, 163, 184, .28);
            stroke-width: 1.2;
        }

        .model-graphic .line-accent {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .model-graphic .node {
            fill: var(--accent);
        }

        .model-graphic .node-soft {
            fill: #94a3b8;
            opacity: .5;
        }

        .profile-hero h1 {
            max-width: 620px;
            margin-bottom: 10px;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            line-height: .98;
            letter-spacing: -.045em;
        }

        .fixture-line {
            color: #bdc8d5;
            font-size: 15px;
        }

        .hero-projection {
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, .11);
            border-radius: 18px;
            background: rgba(8, 15, 28, .58);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
            backdrop-filter: blur(10px);
        }

        .hero-projection .label {
            color: #9aa9bd;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .hero-points {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-top: 7px;
        }

        .hero-points strong {
            color: white;
            font-size: 4rem;
            line-height: .9;
            letter-spacing: -.06em;
        }

        .hero-points span {
            padding-bottom: 5px;
            color: #9aa9bd;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .projection-rule {
            height: 1px;
            margin: 18px 0 14px;
            background: rgba(255, 255, 255, .09);
        }

        .projection-meta {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            color: #aeb9c9;
            font-size: 12px;
        }

        .projection-meta strong {
            color: white;
        }

        .profile-body {
            padding: 32px;
        }

        .section-heading {
            margin-bottom: 16px;
        }

        .section-heading .eyebrow {
            display: block;
            margin-bottom: 6px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .section-heading h2 {
            font-size: 1.2rem;
            letter-spacing: -.01em;
        }

        .signal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .signal-card {
            min-height: 100px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface-raised);
        }

        .signal-card span {
            display: block;
            margin-bottom: 9px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .signal-card strong {
            display: block;
            color: var(--text);
            font-size: 1.05rem;
        }

        .model-note {
            position: relative;
            padding: 23px 24px 23px 27px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(135deg, var(--surface-soft), var(--surface-raised));
            overflow: hidden;
        }

        .model-note::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: var(--accent);
        }

        .model-note h2 {
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .model-note p {
            max-width: 820px;
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .model-note strong {
            color: var(--text-soft);
        }

        .related {
            padding-top: 4px;
        }

        .related-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .related-player {
            position: relative;
            display: block;
            padding: 18px 18px 17px;
            border: 1px solid var(--border);
            border-radius: 15px;
            text-decoration: none;
            color: var(--text);
            background: var(--surface-raised);
            transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }

        .related-player:hover {
            transform: translateY(-2px);
            border-color: rgba(39, 209, 127, .5);
            background: #172235;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .14);
        }

        .related-player::after {
            content: "→";
            position: absolute;
            top: 18px;
            right: 18px;
            color: var(--text-muted);
            font-size: 15px;
            transition: color .2s ease, transform .2s ease;
        }

        .related-player:hover::after {
            color: var(--accent);
            transform: translateX(2px);
        }

        .related-rank {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .related-player strong {
            display: block;
            margin-bottom: 5px;
            padding-right: 25px;
            font-size: 1rem;
        }

        .related-player span {
            color: var(--text-muted);
            font-size: 12px;
        }

        .state {
            padding: 90px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        footer {
            background: var(--footer);
            color: #aeb6ca;
            text-align: center;
            padding: 25px;
            font-size: 14px;
        }

        body[data-theme="light"] {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --surface-raised: #ffffff;
            --surface-soft: #eef2f5;
            --border: #dce3ea;
            --border-soft: #dce3ea;
            --text: #1f2937;
            --text-muted: #64748b;
            --text-soft: #475569;
            --accent: #20b86d;
            --accent-hover: #17945a;
        }

        body[data-theme="light"] {
            background:
                radial-gradient(circle at 50% -10%, rgba(32, 184, 109, .06), transparent 34%),
                var(--bg);
        }

        body[data-theme="light"] .profile-shell {
            box-shadow: 0 18px 45px rgba(15, 23, 42, .09);
        }

        body[data-theme="light"] .signal-card,
        body[data-theme="light"] .related-player {
            background: #ffffff;
        }

        body[data-theme="light"] .related-player:hover {
            background: #fbfefc;
            box-shadow: 0 10px 25px rgba(15, 23, 42, .08);
        }

        @media (max-width: 800px) {
            header {
                padding: 18px 20px;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                width: 100%;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .theme-toggle {
                margin-left: auto;
                margin-right: auto;
            }

            main {
                padding-top: 30px;
            }

            .profile-hero {
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 30px 24px;
            }

            .profile-hero::before {
                inset: 20px 24px;
            }

            .profile-hero::after {
                left: 50%;
            }

            .player-kit {
                width: 104px;
                height: 104px;
                margin: 0 0 18px;
            }

            .model-graphic {
                width: 165px;
                height: 104px;
                margin-top: 10px;
            }

            .profile-body {
                padding: 24px;
            }

            .signal-grid {
                grid-template-columns: 1fr;
            }

            .related-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .profile-hero h1 {
                font-size: 2.6rem;
            }

            .hero-points strong {
                font-size: 3.3rem;
            }

            .profile-body {
                padding: 20px;
            }

            .model-note {
                padding: 20px 20px 20px 23px;
            }
        }
    
        /* Club-inspired shirt graphics */
        .club-kit {
            --kit-primary: #64748b;
            --kit-secondary: #e5e7eb;
            --kit-accent: #ffffff;
            width: 58px;
            height: 58px;
            flex: 0 0 auto;
            margin-top: -6px;
            padding: 7px;
            border: 1px solid rgba(39, 209, 127, .18);
            border-radius: 14px;
            background: rgba(39, 209, 127, .045);
        }

        .club-kit svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .club-kit .shirt-body {
            fill: var(--kit-primary);
            stroke: rgba(255, 255, 255, .18);
            stroke-width: 1;
            stroke-linejoin: round;
        }

        .club-kit .shirt-panel {
            fill: var(--kit-secondary);
            opacity: .88;
        }

        .club-kit .shirt-trim {
            fill: var(--kit-accent);
            opacity: .9;
        }

        .club-kit .shirt-neck {
            fill: none;
            stroke: var(--kit-accent);
            stroke-width: 1.5;
            stroke-linecap: round;
        }

        .club-kit .shirt-mark {
            fill: var(--kit-accent);
            font-size: 7px;
            font-weight: 900;
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: .3px;
        }

        .club-kit.profile {
            width: 118px;
            height: 118px;
            margin: 4px 0 22px;
            padding: 13px;
            border-radius: 22px;
            background: rgba(255, 255, 255, .035);
            border-color: rgba(255, 255, 255, .10);
        }

        .club-kit.profile .shirt-mark {
            font-size: 10px;
        }

        @media (max-width: 800px) {
            .club-kit.profile {
                width: 104px;
                height: 104px;
                margin: 0 0 18px;
            }
        }
</style>
</head>

    <footer>AI FPL Predictor · Machine-learning FPL analysis</footer>

    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const savedTheme = localStorage.getItem("fpl-theme");
        if (savedTheme === "light") {
            document.body.dataset.theme = "light";
        }

        const themeLabel = themeToggle.querySelector(".theme-toggle-label");

        themeToggle.addEventListener("click", () => {
            const isLight = document.body.dataset.theme === "light";
            if (isLight) {
                localStorage.setItem("fpl-theme", "dark");
                document.body.dataset.theme = "";
                themeLabel.textContent = "Light";
            } else {
                localStorage.setItem("fpl-theme", "light");
                document.body.dataset.theme = "light";
                themeLabel.textContent = "Dark";
            }
        });

        if (savedTheme === "light") {
            themeLabel.textContent = "Dark";
        }

        const params = new URLSearchParams(window.location.search);
        const playerName = params.get("player");
        const content = document.getElementById("player-content");

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function getPlayerShirt(playerName, size = "card") {
            const team = playerTeams[playerName] || "default";
            const colours = shirtColours[team] || ["#64748b", "#e5e7eb", "#ffffff"];
            const className = size === "profile" ? "club-kit profile" : "club-kit";
            const label = team === "default" ? "Stylised football shirt" : "Stylised " + team + " inspired shirt";
            const mark = shirtMarks[team] || "FPL";

            return '<div class="' + className + '" style="--kit-primary:' + colours[0] + ';--kit-secondary:' + colours[1] + ';--kit-accent:' + colours[2] + '" aria-label="' + label + '">' +
                '<svg viewBox="0 0 78 78" role="img" aria-label="' + label + '">' +
                    '<path class="shirt-body" d="M27 12 15 19l7 14 7-4v28h24V29l7 4 7-14-12-7-8 8h-6l-8-8Z"/>' +
                    '<path class="shirt-panel" d="M30 23h18v34H30z"/>' +
                    '<path class="shirt-trim" d="M15 19l7 14 7-4-5-11-7 1zM63 19l-7 14-7-4 5-11 7 1z"/>' +
                    '<path class="shirt-neck" d="M29 12c1 5 4 8 9 8s8-3 9-8"/>' +
                    '<text class="shirt-mark" x="39" y="39" text-anchor="middle">' + mark + '</text>' +
                '</svg>' +
            '</div>';
        }

async function loadPlayerProfile() {
            try {
                if (!playerName) {
                    throw new Error("Player not specified");
                }

                const response = await fetch("predictions.json");
                if (!response.ok) {
                    throw new Error("Prediction data unavailable");
                }

                const data = await response.json();
                const matches = [];

                data.predictions.forEach(fixture => {
                    fixture.players.forEach(player => {
                        if (player.name === playerName) {
                            matches.push({
                                ...player,
                                home: fixture.home,
                                away: fixture.away
                            });
                        }
                    });
                });

                if (matches.length === 0) {
                    throw new Error("Player not found");
                }

                const player = matches[0];
                const fixture = data.predictions.find(
                    item => item.home === player.home && item.away === player.away
                );

                if (!fixture) {
                    throw new Error("Fixture not found");
                }

                const related = fixture.players
                    .filter(other => other.name !== player.name)
                    .sort((a, b) => a.rank - b.rank);

                document.title = player.name + " · AI FPL Predictor";

                content.innerHTML =
                    '<article class="profile-shell">' +
                        '<section class="profile-hero">' +
                            '<div class="hero-copy">' +
                                '<div class="profile-kicker">Gameweek ' + escapeHtml(data.gameweek) + ' · Pre-match model</div>' +
                                '' + getPlayerShirt(player.name, "profile") + '' +
                                '<svg class="model-graphic" viewBox="0 0 190 120" role="img" aria-label="Stylised model signal graphic">' +
                                    '<path class="line" d="M8 92 H182" />' +
                                    '<path class="line" d="M28 18 V100" />' +
                                    '<path class="line" d="M28 76 L72 48 L111 62 L158 25" />' +
                                    '<path class="line-accent" d="M28 76 L72 48 L111 62 L158 25" />' +
                                    '<circle class="node-soft" cx="28" cy="76" r="4" />' +
                                    '<circle class="node-soft" cx="72" cy="48" r="4" />' +
                                    '<circle class="node-soft" cx="111" cy="62" r="4" />' +
                                    '<circle class="node" cx="158" cy="25" r="5" />' +
                                    '<path class="line-accent" d="M158 25 L176 14" opacity=".45" />' +
                                '</svg>' +
                                '<h1>' + escapeHtml(player.name) + '</h1>' +
                                '<div class="fixture-line">' + escapeHtml(player.home) + ' vs ' + escapeHtml(player.away) + '</div>' +
                            '</div>' +
                            '<div class="hero-projection">' +
                                '<div class="label">Expected points</div>' +
                                '<div class="hero-points">' +
                                    '<strong>' + Number(player.prediction).toFixed(2) + '</strong>' +
                                    '<span>model projection</span>' +
                                '</div>' +
                                '<div class="projection-rule"></div>' +
                                '<div class="projection-meta">' +
                                    '<span>Fixture rank</span>' +
                                    '<strong>#' + escapeHtml(player.rank) + '</strong>' +
                                '</div>' +
                            '</div>' +
                        '</section>' +

                        '<section class="profile-body">' +
                            '<div class="section-heading">' +
                                '<span class="eyebrow">Prediction snapshot</span>' +
                                '<h2>Current model context</h2>' +
                            '</div>' +

                            '<div class="signal-grid">' +
                                '<div class="signal-card">' +
                                    '<span>Gameweek</span>' +
                                    '<strong>GW' + escapeHtml(data.gameweek) + '</strong>' +
                                '</div>' +
                                '<div class="signal-card">' +
                                    '<span>Fixture</span>' +
                                    '<strong>' + escapeHtml(player.home) + ' vs ' + escapeHtml(player.away) + '</strong>' +
                                '</div>' +
                                '<div class="signal-card">' +
                                    '<span>Fixture rank</span>' +
                                    '<strong>#' + escapeHtml(player.rank) + ' of 3</strong>' +
                                '</div>' +
                            '</div>' +

                            '<div class="model-note">' +
                                '<h2>How to read this projection</h2>' +
                                '<p>This is the <strong>Random Forest model’s projected FPL points</strong> for this player in the selected Gameweek. It is a model estimate rather than a guaranteed score or a recommendation. As live player data is connected, this profile can become the home for richer information such as current price, position, recent form, minutes and underlying statistics.</p>' +
                            '</div>' +

                            '<section class="related">' +
                                '<div class="section-heading">' +
                                    '<span class="eyebrow">Same fixture</span>' +
                                    '<h2>Other players in this prediction</h2>' +
                                '</div>' +
                                '<div class="related-list">' +
                                    related.map(other =>
                                        '<a class="related-player" href="player.html?player=' + encodeURIComponent(other.name) + '">' +
                                            '<span class="related-rank">Rank #' + escapeHtml(other.rank) + '</span>' +
                                            '<strong>' + escapeHtml(other.name) + '</strong>' +
                                            '<span>' + Number(other.prediction).toFixed(2) + ' expected points</span>' +
                                        '</a>'
                                    ).join("") +
                                '</div>' +
                            '</section>' +
                        '</section>' +
                    '</article>';
            } catch (error) {
                console.error("Player profile loading error:", error);
                content.innerHTML =
                    '<div class="state">This player profile is not available.</div>';
            }
        }

        loadPlayerProfile();
    </script>
</body>
</html>
