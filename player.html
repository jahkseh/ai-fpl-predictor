<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile · AI FPL Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1220;
            --surface: #111827;
            --surface-raised: #141e30;
            --surface-soft: #162033;
            --border: #243047;
            --border-soft: rgba(148, 163, 184, .14);
            --text: #e5e7eb;
            --text-muted: #94a3b8;
            --text-soft: #b8c3d3;
            --accent: #27d17f;
            --accent-hover: #20b86d;
            --hero: #0f172a;
            --header: #0f172a;
            --footer: #0f172a;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(39, 209, 127, .08), transparent 34%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        header {
            background: rgba(15, 23, 42, .96);
            color: white;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        nav a {
            color: #dbe3ee;
            text-decoration: none;
            font-size: 15px;
            transition: color .2s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        .theme-toggle {
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 20px;
            background: transparent;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, .06);
            border-color: var(--accent);
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 42px 20px 80px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .02em;
            transition: color .2s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .profile-shell {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .22);
        }

        .profile-hero {
            position: relative;
            min-height: 310px;
            padding: 42px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            align-items: center;
            gap: 42px;
            overflow: hidden;
            background:
                radial-gradient(circle at 82% 50%, rgba(39, 209, 127, .13), transparent 28%),
                linear-gradient(135deg, #0f172a 0%, #101a2c 55%, #0d1727 100%);
            color: white;
        }

        .profile-hero::before {
            content: "";
            position: absolute;
            inset: 24px 38% 24px 38px;
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 18px;
            background:
                linear-gradient(
                    to right,
                    transparent 49.8%,
                    rgba(255, 255, 255, .05) 50%,
                    transparent 50.2%
                );
            pointer-events: none;
        }

        .profile-hero::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            left: 46%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hero-copy,
        .hero-projection {
            position: relative;
            z-index: 1;
        }

        .profile-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            color: #aebbb5;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .11em;
            text-transform: uppercase;
        }

        .profile-kicker::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 5px rgba(39, 209, 127, .08);
        }

        .player-monogram {
            width: 54px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            border: 1px solid rgba(39, 209, 127, .45);
            border-radius: 15px;
            background: rgba(39, 209, 127, .09);
            color: var(--accent);
            font-size: 14px;
            font-weight: 900;
            letter-spacing: .05em;
        }

        .profile-hero h1 {
            max-width: 620px;
            margin-bottom: 10px;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            line-height: .98;
            letter-spacing: -.045em;
        }

        .fixture-line {
            color: #bdc8d5;
            font-size: 15px;
        }

        .hero-projection {
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, .11);
            border-radius: 18px;
            background: rgba(8, 15, 28, .58);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
            backdrop-filter: blur(10px);
        }

        .hero-projection .label {
            color: #9aa9bd;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .hero-points {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-top: 7px;
        }

        .hero-points strong {
            color: white;
            font-size: 4rem;
            line-height: .9;
            letter-spacing: -.06em;
        }

        .hero-points span {
            padding-bottom: 5px;
            color: #9aa9bd;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .projection-rule {
            height: 1px;
            margin: 18px 0 14px;
            background: rgba(255, 255, 255, .09);
        }

        .projection-meta {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            color: #aeb9c9;
            font-size: 12px;
        }

        .projection-meta strong {
            color: white;
        }

        .profile-body {
            padding: 32px;
        }

        .section-heading {
            margin-bottom: 16px;
        }

        .section-heading .eyebrow {
            display: block;
            margin-bottom: 6px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .section-heading h2 {
            font-size: 1.2rem;
            letter-spacing: -.01em;
        }

        .signal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .signal-card {
            min-height: 100px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface-raised);
        }

        .signal-card span {
            display: block;
            margin-bottom: 9px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .signal-card strong {
            display: block;
            color: var(--text);
            font-size: 1.05rem;
        }

        .model-note {
            position: relative;
            padding: 23px 24px 23px 27px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(135deg, var(--surface-soft), var(--surface-raised));
            overflow: hidden;
        }

        .model-note::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: var(--accent);
        }

        .model-note h2 {
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .model-note p {
            max-width: 820px;
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .model-note strong {
            color: var(--text-soft);
        }

        .related {
            padding-top: 4px;
        }

        .related-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .related-player {
            position: relative;
            display: block;
            padding: 18px 18px 17px;
            border: 1px solid var(--border);
            border-radius: 15px;
            text-decoration: none;
            color: var(--text);
            background: var(--surface-raised);
            transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }

        .related-player:hover {
            transform: translateY(-2px);
            border-color: rgba(39, 209, 127, .5);
            background: #172235;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .14);
        }

        .related-player::after {
            content: "→";
            position: absolute;
            top: 18px;
            right: 18px;
            color: var(--text-muted);
            font-size: 15px;
            transition: color .2s ease, transform .2s ease;
        }

        .related-player:hover::after {
            color: var(--accent);
            transform: translateX(2px);
        }

        .related-rank {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .related-player strong {
            display: block;
            margin-bottom: 5px;
            padding-right: 25px;
            font-size: 1rem;
        }

        .related-player span {
            color: var(--text-muted);
            font-size: 12px;
        }

        .state {
            padding: 90px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        footer {
            background: var(--footer);
            color: #aeb6ca;
            text-align: center;
            padding: 25px;
            font-size: 14px;
        }

        body[data-theme="light"] {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --surface-raised: #ffffff;
            --surface-soft: #eef2f5;
            --border: #dce3ea;
            --border-soft: #dce3ea;
            --text: #1f2937;
            --text-muted: #64748b;
            --text-soft: #475569;
            --accent: #20b86d;
            --accent-hover: #17945a;
        }

        body[data-theme="light"] {
            background:
                radial-gradient(circle at 50% -10%, rgba(32, 184, 109, .06), transparent 34%),
                var(--bg);
        }

        body[data-theme="light"] .profile-shell {
            box-shadow: 0 18px 45px rgba(15, 23, 42, .09);
        }

        body[data-theme="light"] .signal-card,
        body[data-theme="light"] .related-player {
            background: #ffffff;
        }

        body[data-theme="light"] .related-player:hover {
            background: #fbfefc;
            box-shadow: 0 10px 25px rgba(15, 23, 42, .08);
        }

        @media (max-width: 800px) {
            header {
                padding: 18px 20px;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                padding-top: 30px;
            }

            .profile-hero {
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 30px 24px;
            }

            .profile-hero::before {
                inset: 20px 24px;
            }

            .profile-hero::after {
                left: 50%;
            }

            .profile-body {
                padding: 24px;
            }

            .signal-grid {
                grid-template-columns: 1fr;
            }

            .related-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .profile-hero h1 {
                font-size: 2.6rem;
            }

            .hero-points strong {
                font-size: 3.3rem;
            }

            .profile-body {
                padding: 20px;
            }

            .model-note {
                padding: 20px 20px 20px 23px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">AI FPL <span>Predictor</span></div>
            <nav>
                <a href="index.html#home">Home</a>
                <a href="index.html#predictions">Predictions</a>
                <a href="index.html#players">Players</a>
                <a href="index.html#performance">Performance</a>
                <button class="theme-toggle" id="theme-toggle" type="button">☀️ Light</button>
            </nav>
        </div>
    </header>

    <main>
        <a class="back-link" href="index.html#players">← Back to Players</a>

        <div id="player-content">
            <div class="state">Loading player profile...</div>
        </div>
    </main>

    <footer>AI FPL Predictor · Machine-learning FPL analysis</footer>

    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const savedTheme = localStorage.getItem("fpl-theme");

        if (savedTheme === "light") {
            document.body.dataset.theme = "light";
        }

        themeToggle.addEventListener("click", () => {
            const isLight = document.body.dataset.theme === "light";
            if (isLight) {
                localStorage.setItem("fpl-theme", "dark");
                document.body.dataset.theme = "";
            } else {
                localStorage.setItem("fpl-theme", "light");
                document.body.dataset.theme = "light";
            }
        });

        const params = new URLSearchParams(window.location.search);
        const playerName = params.get("player");
        const content = document.getElementById("player-content");

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function playerInitials(name) {
            const parts = String(name).trim().split(/\s+/).filter(Boolean);
            if (parts.length === 1) {
                return parts[0].slice(0, 2).toUpperCase();
            }
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        async function loadPlayerProfile() {
            try {
                if (!playerName) {
                    throw new Error("Player not specified");
                }

                const response = await fetch("predictions.json");
                if (!response.ok) {
                    throw new Error("Prediction data unavailable");
                }

                const data = await response.json();
                const matches = [];

                data.predictions.forEach(fixture => {
                    fixture.players.forEach(player => {
                        if (player.name === playerName) {
                            matches.push({
                                ...player,
                                home: fixture.home,
                                away: fixture.away
                            });
                        }
                    });
                });

                if (matches.length === 0) {
                    throw new Error("Player not found");
                }

                const player = matches[0];
                const fixture = data.predictions.find(
                    item => item.home === player.home && item.away === player.away
                );

                if (!fixture) {
                    throw new Error("Fixture not found");
                }

                const related = fixture.players
                    .filter(other => other.name !== player.name)
                    .sort((a, b) => a.rank - b.rank);

                document.title = player.name + " · AI FPL Predictor";

                content.innerHTML =
                    '<article class="profile-shell">' +
                        '<section class="profile-hero">' +
                            '<div class="hero-copy">' +
                                '<div class="profile-kicker">Gameweek ' + escapeHtml(data.gameweek) + ' · Pre-match model</div>' +
                                '<div class="player-monogram" aria-hidden="true">' + escapeHtml(playerInitials(player.name)) + '</div>' +
                                '<h1>' + escapeHtml(player.name) + '</h1>' +
                                '<div class="fixture-line">' + escapeHtml(player.home) + ' vs ' + escapeHtml(player.away) + '</div>' +
                            '</div>' +
                            '<div class="hero-projection">' +
                                '<div class="label">Expected points</div>' +
                                '<div class="hero-points">' +
                                    '<strong>' + Number(player.prediction).toFixed(2) + '</strong>' +
                                    '<span>model projection</span>' +
                                '</div>' +
                                '<div class="projection-rule"></div>' +
                                '<div class="projection-meta">' +
                                    '<span>Fixture rank</span>' +
                                    '<strong>#' + escapeHtml(player.rank) + '</strong>' +
                                '</div>' +
                            '</div>' +
                        '</section>' +

                        '<section class="profile-body">' +
                            '<div class="section-heading">' +
                                '<span class="eyebrow">Prediction snapshot</span>' +
                                '<h2>Current model context</h2>' +
                            '</div>' +

                            '<div class="signal-grid">' +
                                '<div class="signal-card">' +
                                    '<span>Gameweek</span>' +
                                    '<strong>GW' + escapeHtml(data.gameweek) + '</strong>' +
                                '</div>' +
                                '<div class="signal-card">' +
                                    '<span>Fixture</span>' +
                                    '<strong>' + escapeHtml(player.home) + ' vs ' + escapeHtml(player.away) + '</strong>' +
                                '</div>' +
                                '<div class="signal-card">' +
                                    '<span>Fixture rank</span>' +
                                    '<strong>#' + escapeHtml(player.rank) + ' of 3</strong>' +
                                '</div>' +
                            '</div>' +

                            '<div class="model-note">' +
                                '<h2>How to read this projection</h2>' +
                                '<p>This is the <strong>Random Forest model’s projected FPL points</strong> for this player in the selected Gameweek. It is a model estimate rather than a guaranteed score or a recommendation. As live player data is connected, this profile can become the home for richer information such as current price, position, recent form, minutes and underlying statistics.</p>' +
                            '</div>' +

                            '<section class="related">' +
                                '<div class="section-heading">' +
                                    '<span class="eyebrow">Same fixture</span>' +
                                    '<h2>Other players in this prediction</h2>' +
                                '</div>' +
                                '<div class="related-list">' +
                                    related.map(other =>
                                        '<a class="related-player" href="player.html?player=' + encodeURIComponent(other.name) + '">' +
                                            '<span class="related-rank">Rank #' + escapeHtml(other.rank) + '</span>' +
                                            '<strong>' + escapeHtml(other.name) + '</strong>' +
                                            '<span>' + Number(other.prediction).toFixed(2) + ' expected points</span>' +
                                        '</a>'
                                    ).join("") +
                                '</div>' +
                            '</section>' +
                        '</section>' +
                    '</article>';
            } catch (error) {
                console.error("Player profile loading error:", error);
                content.innerHTML =
                    '<div class="state">This player profile is not available.</div>';
            }
        }

        loadPlayerProfile();
    </script>
</body>
</html>
