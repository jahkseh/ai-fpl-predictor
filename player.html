<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile · ScoutXI</title>
    <meta name="description" content="Explore player predictions, form, underlying stats and upcoming fixtures with ScoutXI FPL analytics.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Player Profiles · ScoutXI">
    <meta property="og:description" content="AI-powered Fantasy Premier League analytics, player insights and smarter squad planning.">
    <meta property="og:url" content="https://jahkseh.github.io/ai-fpl-predictor/">
    <meta property="og:image" content="https://jahkseh.github.io/ai-fpl-predictor/social-preview.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://jahkseh.github.io/ai-fpl-predictor/social-preview.svg">
    <meta name="theme-color" content="#2B50F0">
    <link rel="icon" type="image/svg+xml" href="assets/scoutxi-icon.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1220;
            --surface: #111827;
            --surface-raised: #141e30;
            --surface-soft: #162033;
            --border: #243047;
            --border-soft: rgba(148, 163, 184, .14);
            --text: #e5e7eb;
            --text-muted: #94a3b8;
            --text-soft: #b8c3d3;
            --accent: #5b8cff;
            --accent-hover: #155eef;
            --hero: #0f172a;
            --header: #0f172a;
            --footer: #0f172a;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(91, 140, 255, .10), transparent 34%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        header {
            background: rgba(15, 23, 42, .96);
            color: white;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        nav a {
            color: #dbe3ee;
            text-decoration: none;
            font-size: 15px;
            transition: color .2s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        .theme-toggle {
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 20px;
            background: transparent;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, .06);
            border-color: var(--accent);
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 42px 20px 80px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .02em;
            transition: color .2s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .profile-shell {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .22);
        }

        .profile-hero {
            position: relative;
            min-height: 310px;
            padding: 42px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            align-items: center;
            gap: 42px;
            overflow: hidden;
            background:
                radial-gradient(circle at 82% 50%, rgba(91, 140, 255, .16), transparent 28%),
                linear-gradient(135deg, #0f172a 0%, #101a2c 55%, #0d1727 100%);
            color: white;
        }

        .profile-hero::before {
            content: "";
            position: absolute;
            inset: 24px 38% 24px 38px;
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 18px;
            background:
                linear-gradient(
                    to right,
                    transparent 49.8%,
                    rgba(255, 255, 255, .05) 50%,
                    transparent 50.2%
                );
            pointer-events: none;
        }

        .profile-hero::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            left: 46%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hero-copy,
        .hero-projection {
            position: relative;
            z-index: 1;
        }

        .profile-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            color: #b7caff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .11em;
            text-transform: uppercase;
        }

        .profile-kicker::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 5px rgba(91, 140, 255, .10);
        }

        .model-graphic {
            width: 190px;
            height: 120px;
            display: block;
            margin-top: 22px;
            opacity: .95;
        }

        .model-graphic .line {
            fill: none;
            stroke: rgba(148, 163, 184, .28);
            stroke-width: 1.2;
        }

        .model-graphic .line-accent {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .model-graphic .node {
            fill: var(--accent);
        }

        .model-graphic .node-soft {
            fill: #94a3b8;
            opacity: .5;
        }

        .profile-hero h1 {
            max-width: 620px;
            margin-bottom: 10px;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            line-height: .98;
            letter-spacing: -.045em;
        }

        .fixture-line {
            color: #bdc8d5;
            font-size: 15px;
        }

        .hero-projection {
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, .11);
            border-radius: 18px;
            background: rgba(8, 15, 28, .58);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
            backdrop-filter: blur(10px);
        }

        .hero-projection .label {
            color: #9aa9bd;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .hero-points {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-top: 7px;
        }

        .hero-points strong {
            color: white;
            font-size: 4rem;
            line-height: .9;
            letter-spacing: -.06em;
        }

        .hero-points span {
            padding-bottom: 5px;
            color: #9aa9bd;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .projection-rule {
            height: 1px;
            margin: 18px 0 14px;
            background: rgba(255, 255, 255, .09);
        }

        .projection-meta {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            color: #aeb9c9;
            font-size: 12px;
        }

        .projection-meta strong {
            color: white;
        }

        .profile-body {
            padding: 32px;
        }

        .section-heading {
            margin-bottom: 16px;
        }

        .section-heading .eyebrow {
            display: block;
            margin-bottom: 6px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .section-heading h2 {
            font-size: 1.2rem;
            letter-spacing: -.01em;
        }

        .signal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .signal-card {
            min-height: 100px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface-raised);
        }

        .signal-card span {
            display: block;
            margin-bottom: 9px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .signal-card strong {
            display: block;
            color: var(--text);
            font-size: 1.05rem;
        }

        .model-note {
            position: relative;
            padding: 23px 24px 23px 27px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(135deg, var(--surface-soft), var(--surface-raised));
            overflow: hidden;
        }

        .model-note::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: var(--accent);
        }

        .model-note h2 {
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .model-note p {
            max-width: 820px;
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .model-note strong {
            color: var(--text-soft);
        }

        .related {
            padding-top: 4px;
        }

        .related-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .related-player {
            position: relative;
            display: block;
            padding: 18px 18px 17px;
            border: 1px solid var(--border);
            border-radius: 15px;
            text-decoration: none;
            color: var(--text);
            background: var(--surface-raised);
            transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }

        .related-player:hover {
            transform: translateY(-2px);
            border-color: rgba(91, 140, 255, .5);
            background: #172235;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .14);
        }

        .related-player::after {
            content: "→";
            position: absolute;
            top: 18px;
            right: 18px;
            color: var(--text-muted);
            font-size: 15px;
            transition: color .2s ease, transform .2s ease;
        }

        .related-player:hover::after {
            color: var(--accent);
            transform: translateX(2px);
        }

        .related-rank {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .related-player strong {
            display: block;
            margin-bottom: 5px;
            padding-right: 25px;
            font-size: 1rem;
        }

        .related-player span {
            color: var(--text-muted);
            font-size: 12px;
        }

        .state {
            padding: 90px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        footer {
            background: var(--footer);
            color: #aeb6ca;
            text-align: center;
            padding: 25px;
            font-size: 14px;
        }

        body[data-theme="light"] {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --surface-raised: #ffffff;
            --surface-soft: #eef2f5;
            --border: #dce3ea;
            --border-soft: #dce3ea;
            --text: #1f2937;
            --text-muted: #64748b;
            --text-soft: #475569;
            --accent: #155eef;
            --accent-hover: #1049c7;
        }

        body[data-theme="light"] {
            background:
                radial-gradient(circle at 50% -10%, rgba(91, 140, 255, .07), transparent 34%),
                var(--bg);
        }

        body[data-theme="light"] .profile-shell {
            box-shadow: 0 18px 45px rgba(15, 23, 42, .09);
        }

        body[data-theme="light"] .signal-card,
        body[data-theme="light"] .related-player {
            background: #ffffff;
        }

        body[data-theme="light"] .related-player:hover {
            background: #fbfefc;
            box-shadow: 0 10px 25px rgba(15, 23, 42, .08);
        }

        @media (max-width: 800px) {
            header {
                padding: 18px 20px;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                width: 100%;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .theme-toggle {
                margin-left: auto;
                margin-right: auto;
            }

            main {
                padding-top: 30px;
            }

            .profile-hero {
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 30px 24px;
            }

            .profile-hero::before {
                inset: 20px 24px;
            }

            .profile-hero::after {
                left: 50%;
            }

            .model-graphic {
                width: 165px;
                height: 104px;
                margin-top: 10px;
            }

            .profile-body {
                padding: 24px;
            }

            .signal-grid {
                grid-template-columns: 1fr;
            }

            .related-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .profile-hero h1 {
                font-size: 2.6rem;
            }

            .hero-points strong {
                font-size: 3.3rem;
            }

            .profile-body {
                padding: 20px;
            }

            .model-note {
                padding: 20px 20px 20px 23px;
            }
        }
    
        /* Profile information polish */
        .profile-team-line {
            display:inline-flex;
            align-items:center;
            gap:8px;
            margin:0 0 12px;
            padding:6px 10px;
            border:1px solid color-mix(in srgb,var(--profile-team-colour) 55%, rgba(255,255,255,.12));
            box-shadow:0 0 0 2px rgba(255,255,255,.04);
            border-radius:999px;
            background:color-mix(in srgb,var(--profile-team-colour) 10%, rgba(8,15,28,.55));
            color:#d7e0eb;
            font-size:11px;
            font-weight:800;
            letter-spacing:.06em;
            text-transform:uppercase;
        }
        .profile-team-dot {
            width:7px;
            height:7px;
            border-radius:50%;
            background:var(--profile-team-colour);
            box-shadow:0 0 0 3px color-mix(in srgb,var(--profile-team-colour) 14%, transparent);
        }
        .profile-hero .fixture-line {
            display:block;
        }
        .projection-meta {
            flex-direction:column;
            align-items:stretch;
            gap:10px;
        }
        .projection-meta-row {
            display:flex;
            justify-content:space-between;
            gap:14px;
        }
        .projection-meta-row span { color:#aeb9c9; }
        .projection-meta-row strong { color:white; }
        .projection-meta-row.highlight strong { color:var(--accent); }
        .profile-comparison {
            margin:0 0 32px;
            padding:20px 22px;
            border:1px solid var(--border);
            border-radius:16px;
            background:var(--surface-raised);
        }
        .profile-comparison-head {
            display:flex;
            justify-content:space-between;
            gap:16px;
            align-items:baseline;
            margin-bottom:8px;
        }
        .profile-comparison-head h2 { font-size:1.05rem; }
        .profile-comparison-head span {
            color:var(--text-muted);
            font-size:11px;
            font-weight:800;
            letter-spacing:.06em;
            text-transform:uppercase;
        }
        .profile-comparison p {
            color:var(--text-muted);
            font-size:13px;
            line-height:1.65;
        }
        .profile-comparison strong { color:var(--text); }
        @media (max-width:800px) {
            .profile-team-line { margin-bottom:10px; }
        }
        @media (max-width:520px) {
            .profile-comparison-head { align-items:flex-start; flex-direction:column; gap:5px; }
        }

                /* Team identity visuals */
        .team-visual {
            --team-primary: #64748b;
            --team-secondary: #e5e7eb;
            --team-accent: #ffffff;
            width: 58px;
            height: 58px;
            flex: 0 0 auto;
            margin-top: -6px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 15px;
            background: var(--team-primary);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
        }

        .team-visual::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--team-primary) 0 52%, var(--team-secondary) 52% 76%, var(--team-accent) 76% 100%);
            opacity: .96;
        }

        .team-visual::after {
            content: "";
            position: absolute;
            width: 26px;
            height: 26px;
            right: -7px;
            bottom: -7px;
            border: 2px solid rgba(255,255,255,.55);
            border-radius: 50%;
            opacity: .55;
        }

        .team-visual span {
            position: relative;
            z-index: 1;
            min-width: 38px;
            padding: 5px 4px;
            border-radius: 7px;
            background: rgba(10, 18, 32, .78);
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .08em;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,.28);
        }

        .team-visual.profile {
            width: 118px;
            height: 118px;
            margin: 4px 0 22px;
            border-radius: 24px;
        }

        .team-visual.profile span {
            min-width: 64px;
            padding: 9px 8px;
            border-radius: 10px;
            font-size: 14px;
        }

        .team-visual.profile::after {
            width: 54px;
            height: 54px;
            right: -14px;
            bottom: -14px;
        }

        @media (max-width: 800px) {
            .team-visual.profile {
                width: 104px;
                height: 104px;
                margin: 0 0 18px;
            }
        }

        .live-profile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.live-profile-stat{padding:16px;border:1px solid var(--border);border-radius:13px;background:var(--surface)}.live-profile-stat span{display:block;color:var(--text-muted);font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.live-profile-stat strong{display:block;margin-top:7px;color:var(--text);font-size:1.12rem}.live-profile-stat small{display:block;margin-top:4px;color:var(--text-muted);font-size:10px}.live-profile-wide{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.live-profile-panel{padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.live-profile-panel h3{margin-bottom:12px}.live-profile-panel p{color:var(--text-muted);font-size:12px;line-height:1.6}.live-profile-panel strong{color:var(--text)}@media(max-width:760px){.live-profile-grid{grid-template-columns:repeat(2,1fr)}.live-profile-wide{grid-template-columns:1fr}}
        /* Phase 6 player profile */
        .profile-model-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
        .profile-model-card{padding:17px;border:1px solid var(--border);border-radius:14px;background:var(--surface-raised)}
        .profile-model-card span{display:block;color:var(--text-muted);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
        .profile-model-card strong{display:block;margin-top:8px;color:var(--text);font-size:1rem;line-height:1.2}
        .profile-model-card small{display:block;margin-top:5px;color:var(--text-muted);font-size:10px;line-height:1.45}
        .profile-range{display:flex;align-items:center;gap:9px;margin-top:9px}
        .profile-range-track{height:6px;flex:1;border-radius:999px;background:var(--surface-soft);overflow:hidden}
        .profile-range-fill{height:100%;border-radius:999px;background:var(--accent)}
        .profile-range-label{color:var(--text-muted);font-size:10px;font-weight:800;white-space:nowrap}
        .profile-form-list{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:30px}
        .profile-form-card{padding:15px;border:1px solid var(--border);border-radius:13px;background:var(--surface-raised)}
        .profile-form-card .gw{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
        .profile-form-card strong{display:block;margin-top:8px;color:var(--text);font-size:1.25rem}
        .profile-form-card small{display:block;margin-top:4px;color:var(--text-muted);font-size:10px}
        .profile-form-card p{margin-top:10px;color:var(--text-muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .profile-underlying-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:30px}
        .profile-underlying{padding:15px;border:1px solid var(--border);border-radius:13px;background:var(--surface-raised)}
        .profile-underlying span{display:block;color:var(--text-muted);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
        .profile-underlying strong{display:block;margin-top:7px;color:var(--text);font-size:1.08rem}
        .profile-performance-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:30px}
        .profile-performance{padding:15px;border:1px solid var(--border);border-radius:13px;background:var(--surface-raised)}
        .profile-performance span{display:block;color:var(--text-muted);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
        .profile-performance strong{display:block;margin-top:7px;color:var(--text);font-size:1.08rem}
        .profile-performance small{display:block;margin-top:4px;color:var(--text-muted);font-size:9px}

        .profile-fixture-list{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:30px}
        .profile-fixture{padding:15px;border:1px solid var(--border);border-radius:13px;background:var(--surface-raised)}
        .profile-fixture-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
        .profile-fixture-gw{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.08em}
        .profile-fixture-difficulty{padding:3px 6px;border-radius:6px;background:var(--surface-soft);color:var(--text-muted);font-size:9px;font-weight:900}
        .profile-fixture strong{display:block;margin-top:12px;color:var(--text);font-size:12px;line-height:1.35}

    <script>

        function getTeamVisual(playerName, size = "card", teamOverride = null) {
            const team = teamOverride || playerTeams[playerName] || "default";
            const colours = shirtColours[team] || ["#64748b", "#e5e7eb", "#ffffff"];
            const className = size === "profile" ? "team-visual profile" : "team-visual";
            const code = shirtMarks[team] || "FPL";
            const label = team === "default" ? "Football team visual" : team + " team colours";

            return '<div class="' + className + '" style="--team-primary:' + colours[0] + ';--team-secondary:' + colours[1] + ';--team-accent:' + colours[2] + '" role="img" aria-label="' + label + '"><span>' + code + '</span></div>';
        }


        function formatNumber(value, digits = 2) {
            const number = Number(value);
            return Number.isFinite(number) ? number.toFixed(digits) : "—";
        }

        function percent(value, digits = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? (number * 100).toFixed(digits) + "%" : "—";
        }

        function metric(value, suffix = "", digits = 2) {
            const number = Number(value);
            return Number.isFinite(number) ? number.toFixed(digits) + suffix : "—";
        }

        function makeWhyRows(profile) {
            if (Array.isArray(profile.why) && profile.why.length) return profile.why;
            const inputs = profile.model_inputs || {};
            const current = inputs.current_form || {};
            const history = inputs.historical_ability || {};
            const club = inputs.current_club || {};
            const attack = inputs.team_attack || {};
            const defence = inputs.opponent_defence || {};
            return [
                {label:"Historical ability",value:metric(history.points_per_90," pts/90"),detail:"Career historical points per 90 used as the long-term player prior."},
                {label:"Current form",value:metric(current.recent_3_points," pts/GW"),detail:"Average points across the previous three completed gameweeks."},
                {label:"Club history",value:metric(club.points_per_90," pts/90"),detail:"Most recent player-at-club historical rate; after a transfer this can refer to the previous club."},
                {label:"Team attack",value:metric(attack.xg_for_per_90," xG/90"),detail:"Current team attacking environment from completed fixtures."},
                {label:"Opponent defence",value:metric(defence.xg_against_per_90," xGA/90"),detail:"Opponent defensive environment from completed fixtures."},
                {label:"Expected minutes",value:metric(inputs.expected_minutes," min",1),detail:"Separate expected-minutes model output."},
                {label:"Home / away",value:inputs.home_away === "home" ? "Home" : "Away",detail:"Fixture location supplied to the points model."},
                {label:"Fixture environment",value:metric(inputs.fixture_environment," combined xG"),detail:"Team and opponent attacking/defensive fixture environment."}
            ];
        }

        function renderPlayerProfile(profile, dataGameweek, nextGameweek, predictionHistory = []) {
            const team = profile.team || playerTeams[profile.name] || "Team";
            const fixture = profile.fixture || {};
            const prediction = Number(profile.prediction);
            const p10 = Number(profile.prediction_p10);
            const p90 = Number(profile.prediction_p90);
            const rangeWidth = Number.isFinite(p10) && Number.isFinite(p90) ? Math.max(0, p90 - p10) : 0;
            const confidence = profile.confidence || "—";
            const recent = Array.isArray(profile.recent_form) ? profile.recent_form : [];
            const underlying = profile.underlying || {};
            const historicalRecord = profile.historical_record || {};
            const historicalSeasons = Array.isArray(historicalRecord.seasons) ? historicalRecord.seasons : [];
            const careerHistory = historicalRecord.career || {};
            const fixtures = Array.isArray(profile.next_fixtures) ? profile.next_fixtures : [];
            const why = makeWhyRows(profile);
            const rangeScale = Number.isFinite(prediction) && rangeWidth > 0 ? Math.min(100, Math.max(8, ((prediction - p10) / rangeWidth) * 100)) : 50;

            document.title = profile.name + " · ScoutXI";

            content.innerHTML =

                        '<div class="hero-copy">' +
                            '<div class="profile-kicker">GW' + escapeHtml(dataGameweek) + ' · Pre-match model</div>' +

                            '<h1>' + escapeHtml(profile.name) + '</h1>' +
                            '<div class="profile-team-line" style="--profile-team-colour:' + (teamAccentColours[team] || "#5b8cff") + '">' +
                                '<span class="profile-team-dot"></span>' + escapeHtml(shirtMarks[team] || "FPL") + ' · ' + escapeHtml(team) +
                            '</div>' +
                            '<div class="fixture-line">' +
                                escapeHtml(fixture.home || "—") + ' ' + (fixture.is_home ? 'vs' : 'at') + ' ' + escapeHtml(fixture.away || fixture.opponent || "—") +
                            '</div>' +
                        '</div>' +
                        '<div class="hero-projection">' +
                            '<div class="label">Expected points</div>' +
                            '<div class="hero-points"><strong>' + (Number.isFinite(prediction) ? prediction.toFixed(2) : '—') + '</strong><span>model projection</span></div>' +
                            '<div class="projection-rule"></div>' +
                            '<div class="projection-meter" aria-label="Projection position within P10 to P90"><div class="projection-meter-fill" style="width:' + rangeScale + '%"></div></div>' +

                            '<div class="projection-meta">' +
                                '<div class="projection-meta-row highlight"><span>P10–P90</span><strong>' + (Number.isFinite(p10) && Number.isFinite(p90) ? p10.toFixed(1) + '–' + p90.toFixed(1) : '—') + '</strong></div>' +
                                '<div class="projection-meta-row"><span>Confidence</span><strong>' + escapeHtml(confidence) + '</strong></div>' +
                                '<div class="projection-meta-row"><span>Expected minutes</span><strong>' + metric(profile.expected_minutes, " min", 0) + '</strong></div>' +
                                '<div class="projection-meta-row"><span>Price / ownership</span><strong>' + (Number.isFinite(Number(profile.price)) ? '£' + Number(profile.price).toFixed(1) + 'm' : '—') + ' · ' + (Number.isFinite(Number(profile.ownership)) ? Number(profile.ownership).toFixed(1) + '%' : '—') + '</strong></div>' +

                        '</div>' +

                            '<div class="profile-quick-stat"><span>Price</span><strong>' + (Number.isFinite(Number(profile.price)) ? "£" + Number(profile.price).toFixed(1) + "m" : "—") + '</strong></div>' +
                            '<div class="profile-quick-stat"><span>Ownership</span><strong>' + (Number.isFinite(Number(profile.ownership)) ? Number(profile.ownership).toFixed(1) + "%" : "—") + '</strong></div>' +
                            '<div class="profile-quick-stat"><span>Expected min</span><strong>' + metric(profile.expected_minutes, " min", 0) + '</strong></div>' +
                            '<div class="profile-quick-stat"><span>Start chance</span><strong>' + percent(profile.start_probability) + '</strong></div>' +
                        '</div>' +
                        '<div class="profile-data-strip">' +
                            '<span class="profile-data-chip">Pre-match model snapshot</span>' +
                            '<span class="profile-data-chip">' + (recent.length ? recent.length + " recent GWs" : "Recent form pending") + '</span>' +
                            '<span class="profile-data-chip">' + (fixtures.length ? fixtures.length + " upcoming fixtures" : "Fixture schedule pending") + '</span>' +
                        '</div>' +
                        '<div class="section-heading"><span class="eyebrow">Model breakdown</span><h2>What the prediction is built from</h2></div>' +
                        '<p class="profile-section-note">These are the model inputs and context values used for this player and fixture. They are not feature-importance scores.</p>' +
                        '<div class="profile-model-grid">' +
                            '<div class="profile-model-card"><span>Historical ability</span><strong>' + metric(profile.model_inputs?.historical_ability?.points_per_90, " pts/90") + '</strong><small>Career prior · xG/90 ' + metric(profile.model_inputs?.historical_ability?.xg_per_90) + ' · xA/90 ' + metric(profile.model_inputs?.historical_ability?.xa_per_90) + '</small></div>' +
                            '<div class="profile-model-card"><span>Current form</span><strong>' + metric(profile.model_inputs?.current_form?.recent_3_points, " pts/GW") + '</strong><small>Previous 3 GW · ' + metric(profile.model_inputs?.current_form?.recent_3_minutes, " min", 0) + ' avg · xG ' + metric(profile.model_inputs?.current_form?.recent_3_xg) + '</small></div>' +
                            '<div class="profile-model-card"><span>Club history</span><strong>' + metric(profile.model_inputs?.current_club?.points_per_90, " pts/90") + '</strong><small>Club history · start rate ' + percent(profile.model_inputs?.current_club?.start_rate) + '</small></div>' +
                            '<div class="profile-model-card"><span>Team attack</span><strong>' + metric(profile.model_inputs?.team_attack?.xg_for_per_90, " xG/90") + '</strong><small>Goals/90 ' + metric(profile.model_inputs?.team_attack?.goals_for_per_90) + '</small></div>' +

        async function loadPlayerProfile() {
            try {
                if (!playerName) throw new Error("Player not specified");

                let profileData = null;
                let playerHistory = [];
                try {
                    const [profileResponse, historyResponse] = await Promise.all([
                        fetch("player_profiles.json?ts=" + Date.now()),
                        fetch("prediction_history.json?ts=" + Date.now())
                    ]);
                    if (profileResponse.ok) profileData = await profileResponse.json();
                    const predictionHistoryData = historyResponse.ok ? await historyResponse.json() : {gameweeks: []};
                    const normalizeHistoryName = value => String(value || "")
                        .normalize("NFD")
                        .replace(/[\\u0300-\\u036f]/g, "")
                        .replace(/[^a-z0-9]/gi, "")
                        .toLowerCase();
                    playerHistory = Array.isArray(predictionHistoryData.gameweeks)
                        ? predictionHistoryData.gameweeks.flatMap(gameweek =>
                            (Array.isArray(gameweek.predictions) ? gameweek.predictions : []).flatMap(fixture =>
                                (Array.isArray(fixture.players) ? fixture.players : [])
                                    .filter(player => normalizeHistoryName(player.name) === normalizeHistoryName(playerName))
                                    .map(player => ({
                                        gameweek: gameweek.gameweek,
                                        prediction: player.prediction,
                                        p10: player.prediction_p10,
                                        p90: player.prediction_p90,
                                        confidence: player.confidence
                                    }))
                            )
                        ).sort((a, b) => Number(b.gameweek) - Number(a.gameweek)).slice(0, 5)
                        : [];
                } catch (error) {
                    console.info("Player profile dataset unavailable; using live fallback:", error);
                }

                if (profileData && Array.isArray(profileData.players)) {
                    const normalizedPlayerName = value => String(value || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").replace(/[^a-z0-9]/gi, "").toLowerCase();
                    const requestedName = normalizedPlayerName(playerName);
                    const profile = profileData.players.find(item =>
                        normalizedPlayerName(item.name) === requestedName
                    );
                    if (profile) {
                        renderPlayerProfile(profile, profileData.data_gameweek, profileData.next_gameweek, playerHistory);
                        return;
                    }
                    // Profiles may lag behind live player data after transfers, new signings or a data refresh.
                    // Continue to the live-data fallback instead of failing the page immediately.
                    console.info("No prebuilt profile for " + playerName + "; trying live player data.");
                }

                const [predictionResponse, liveResponse] = await Promise.all([
                    fetch("predictions.json?ts=" + Date.now()),
                    fetch("live_data.json?ts=" + Date.now())
                ]);
                if (!predictionResponse.ok || !liveResponse.ok) throw new Error("Player data unavailable");
                const predictionData = await predictionResponse.json();
                const liveData = await liveResponse.json();
                const normalizePlayerName = value => String(value || "")
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9]/gi, "")
                    .toLowerCase();
                const requestedPlayerKey = normalizePlayerName(playerName);
                const livePlayers = Array.isArray(liveData.players) ? liveData.players : [];
                const live = livePlayers.find(item => normalizePlayerName(item.name) === requestedPlayerKey);
                if (!live) {
                    console.error("Player profile not found in live_data.json", {
                        requestedPlayer: playerName,
                        availablePlayerCount: livePlayers.length
                    });
                    throw new Error("Player not found in live data");
                }

                const allPredictions = Array.isArray(predictionData.all_players)
                    ? predictionData.all_players
                    : (Array.isArray(predictionData.predictions) ? predictionData.predictions : []).flatMap(fixture =>
                        (Array.isArray(fixture.players) ? fixture.players : []).map(itemPlayer => ({
                            ...itemPlayer,
                            fixture_home: itemPlayer.fixture_home || fixture.home,
                            fixture_away: itemPlayer.fixture_away || fixture.away
                        }))
                    );
                const predicted = allPredictions.find(item =>
                    normalizePlayerName(item.name) === requestedPlayerKey &&
                    (!item.fixture_home || !live.fixture?.home || item.fixture_home === live.fixture.home) &&
                    (!item.fixture_away || !live.fixture?.away || item.fixture_away === live.fixture.away)
                ) || allPredictions.find(item => normalizePlayerName(item.name) === requestedPlayerKey) || {};
                const fallback = {
                    ...live,
                    prediction: predicted.prediction ?? live.prediction,
                    prediction_p10: predicted.prediction_p10 ?? live.prediction_p10,
                    prediction_p90: predicted.prediction_p90 ?? live.prediction_p90,
                    confidence: predicted.confidence ?? live.confidence,
                    expected_minutes: predicted.expected_minutes ?? live.expected_minutes,
                    start_probability: predicted.start_probability ?? live.start_probability,
                    sixty_probability: predicted.sixty_probability ?? live.sixty_probability,
                    fixture: live.fixture,
                    model_inputs: predicted.model_inputs || {
                        team_attack: {xg_for_per_90: predicted.fixture_context?.team_xg_for_per90, goals_for_per_90: predicted.fixture_context?.team_goals_for_per90},
                        opponent_defence: {xg_against_per_90: predicted.fixture_context?.opponent_xg_against_per90, goals_against_per_90: predicted.fixture_context?.opponent_goals_against_per90},
                        expected_minutes: predicted.expected_minutes ?? live.expected_minutes,
                        home_away: predicted.fixture_context?.is_home ? "home" : "away",
                        fixture_environment: predicted.fixture_context?.fixture_xg_environment,
                    },
                    fixture_context: predicted.fixture_context || live.fixture_context || {},
                    why: makeWhyRows({model_inputs: predicted.model_inputs || {
                        team_attack: {xg_for_per_90: predicted.fixture_context?.team_xg_for_per90},
                        opponent_defence: {xg_against_per_90: predicted.fixture_context?.opponent_xg_against_per90},
                        expected_minutes: predicted.expected_minutes ?? live.expected_minutes,
                        home_away: predicted.fixture_context?.is_home ? "home" : "away",
                        fixture_environment: predicted.fixture_context?.fixture_xg_environment
                    }})
                };
                renderPlayerProfile(fallback, predictionData.gameweek, predictionData.gameweek, []);
            } catch (error) {
                console.error("Player profile loading error:", error);
                content.innerHTML = '<div class="state">This player profile is not available.</div>';
            }
        }

        loadPlayerProfile();
    </script>

<script>
/* Lightweight scroll-in motion; respects reduced-motion preferences and supports dynamic content. */
(function(){
  if(!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const selector=".section,.section-title,.hero-stat,.prediction-card,.fixture-card,.player-card,.panel-surface,.player-compare-shell,.prediction-overview,.overview-stat,.overview-intro,.builder-ai-card,.snapshot-card,.team-hero,.profile-shell";
  const seen=new WeakSet();
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:0.08,rootMargin:"0px 0px -35px 0px"});
  function prepare(root){
    if(root.nodeType!==1) return;
    if(root.matches(selector) && !seen.has(root)){
      seen.add(root);
      root.classList.add("scroll-reveal");
      observer.observe(root);
    }
    root.querySelectorAll?.(selector).forEach(el=>{
      if(seen.has(el)) return;
      seen.add(el);
      el.classList.add("scroll-reveal");
      observer.observe(el);
    });
  }
  prepare(document.documentElement);
  new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(prepare))).observe(document.body,{childList:true,subtree:true});
})();
</script>
