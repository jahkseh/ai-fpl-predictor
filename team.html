<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1220;--surface:#111827;--surface-soft:#162033;--border:#243047;--text:#e5e7eb;--text-muted:#94a3b8;--accent:#5b8cff;--accent-hover:#155eef;--header:#0f172a;--footer:#0f172a}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:background .25s ease,color .25s ease}
body[data-theme="light"]{--bg:#f7f8fa;--surface:#fff;--surface-soft:#eef2f5;--border:#dce3ea;--text:#1f2937;--text-muted:#64748b;--accent:#155eef;--accent-hover:#1049c7;--header:#0f172a;--footer:#0f172a}
header{background:var(--header);color:#fff;padding:20px 40px}
.navbar{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:700}.logo span{color:var(--accent)}
nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:flex-end}
nav a{color:#fff;text-decoration:none;font-size:15px}nav a:hover{color:var(--accent)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-left:4px;padding:8px 12px;border:1px solid #334155;border-radius:20px;background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.theme-toggle:hover{background:rgba(255,255,255,.08);border-color:var(--accent)}
.theme-toggle-icon{width:13px;height:13px;display:inline-block;border:1.5px solid currentColor;border-radius:50%;position:relative}.theme-toggle-icon:after{content:"";position:absolute;width:5px;height:5px;top:-3px;right:-3px;border-radius:50%;background:var(--header)}
main{max-width:1200px;margin:0 auto;padding:30px 20px 70px}
.back-link{display:inline-block;margin:8px 0 22px;color:var(--text-muted);font-size:12px;font-weight:700;text-decoration:none}.back-link:hover{color:var(--accent)}
.team-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;padding:34px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:0 18px 50px rgba(0,0,0,.12)}
.team-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--team-colour) 9%,transparent),transparent 48%);pointer-events:none}
.team-copy,.team-snapshot{position:relative;z-index:1}
.team-kicker{color:var(--text-muted);font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.team-heading{display:flex;align-items:center;gap:18px;margin-top:12px}
.team-mark.team-profile-crest{object-fit:contain;display:block;border:0;border-radius:0;background:transparent;box-shadow:none;padding:0}.team-mark.team-profile-crest:after{display:none}.team-mark{width:82px;height:82px;flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid color-mix(in srgb,var(--team-colour) 45%,var(--border));border-radius:22px;background:linear-gradient(135deg,var(--team-colour),color-mix(in srgb,var(--team-colour) 45%,#fff));box-shadow:0 0 0 4px var(--surface),0 0 0 5px color-mix(in srgb,var(--team-colour) 22%,var(--border))}
.team-mark:after{content:"";position:absolute;width:48px;height:48px;right:-16px;bottom:-16px;border:2px solid rgba(255,255,255,.55);border-radius:50%}
.team-mark span{position:relative;z-index:1;padding:8px 9px;border-radius:9px;background:rgba(10,18,32,.78);color:#fff;font-size:14px;font-weight:900;letter-spacing:.06em}
.team-heading h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.04em}
.team-subtitle{margin-top:16px;color:var(--text-muted);font-size:14px;line-height:1.65;max-width:650px}
.team-fixture-line{margin-top:18px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--text);font-size:14px;font-weight:700}
.fixture-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface-soft);color:var(--text-muted);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.fixture-pill strong{color:var(--text)}
.team-snapshot{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center}
.snapshot-card{min-height:104px;padding:17px;border:1px solid var(--border);border-radius:15px;background:var(--surface-soft)}
.snapshot-card span{display:block;color:var(--text-muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.snapshot-card strong{display:block;margin-top:8px;color:var(--text);font-size:1.45rem;letter-spacing:-.03em}
.snapshot-card small{display:block;margin-top:4px;color:var(--text-muted);font-size:10px;line-height:1.4}
.section{padding:46px 0 0}.section-title{margin-bottom:24px}.eyebrow{display:block;margin-bottom:7px;color:var(--accent-hover);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.section-title h2{font-size:1.65rem;letter-spacing:-.025em}.section-title p{margin-top:7px;color:var(--text-muted);font-size:13px}
.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.player-card{position:relative;min-height:168px;padding:19px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-decoration:none;color:inherit;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.player-card:before{content:"";position:absolute;top:0;left:18px;right:18px;height:3px;border-radius:0 0 4px 4px;background:var(--player-colour)}
.player-card:hover,.player-card:focus-visible{transform:translateY(-2px);border-color:var(--player-colour);box-shadow:0 0 0 2px color-mix(in srgb,var(--player-colour) 18%,transparent),0 14px 32px rgba(15,30,22,.12);outline:none}
.player-rank{color:var(--player-colour);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.player-card h3{margin-top:24px;font-size:1.05rem;color:var(--text)}.player-card p{margin-top:5px;color:var(--text-muted);font-size:11px}
.player-points{margin-top:20px;display:flex;align-items:baseline;gap:8px}.player-points strong{font-size:1.8rem;letter-spacing:-.04em}.player-points span{color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.player-link{display:block;margin-top:10px;color:var(--accent-hover);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.empty{padding:24px;border:1px solid var(--border);border-radius:15px;background:var(--surface);color:var(--text-muted);font-size:13px;line-height:1.6}
.future-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.future-card{padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.future-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin-bottom:15px;border:1px solid color-mix(in srgb,var(--team-colour) 25%,var(--border));border-radius:10px;background:color-mix(in srgb,var(--team-colour) 8%,var(--surface));color:var(--team-colour);font-size:11px;font-weight:900}
.future-card h3{font-size:1rem}.future-card p{margin-top:7px;color:var(--text-muted);font-size:12px;line-height:1.55}
.note{margin-top:24px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-soft);color:var(--text-muted);font-size:11px;line-height:1.55}.note strong{color:var(--text)}
footer{background:var(--footer);color:#aeb6ca;text-align:center;padding:25px;font-size:14px}
.state{padding:50px 20px;text-align:center;color:var(--text-muted)}
.team-hero:after{
content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;
border:1px solid color-mix(in srgb,var(--team-colour) 22%,transparent);
border-radius:50%;box-shadow:0 0 0 28px color-mix(in srgb,var(--team-colour) 5%,transparent),0 0 0 56px color-mix(in srgb,var(--team-colour) 3%,transparent);
pointer-events:none;
}
.team-colour-line{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--team-colour),color-mix(in srgb,var(--team-colour) 35%,#fff),transparent);margin:0 0 22px}
.team-status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.team-status{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid color-mix(in srgb,var(--team-colour) 24%,var(--border));border-radius:999px;background:color-mix(in srgb,var(--team-colour) 7%,var(--surface));color:var(--text-muted);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.team-status-dot{width:6px;height:6px;border-radius:50%;background:var(--team-colour)}
.team-page-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 2px}
.team-page-nav a{padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font-size:10px;font-weight:800;text-decoration:none;letter-spacing:.04em;text-transform:uppercase}
.team-page-nav a:hover,.team-page-nav a:focus-visible{border-color:var(--team-colour);color:var(--team-colour);outline:none}
.snapshot-card{position:relative;overflow:hidden}
.snapshot-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--team-colour)}
.snapshot-card strong{color:var(--text)}
.section-panel{padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}
.live-ready{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.future-card{position:relative;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.future-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--team-colour) 7%,transparent),transparent 55%);pointer-events:none}
.future-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--team-colour) 45%,var(--border));box-shadow:0 12px 28px rgba(15,30,22,.08)}
.future-card>*{position:relative;z-index:1}
@media(max-width:800px){.live-ready{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.live-ready{grid-template-columns:1fr}}
@media(max-width:800px){header{padding:18px 20px}.navbar{flex-direction:column;gap:15px}nav{justify-content:center;gap:12px}.team-hero{grid-template-columns:1fr;padding:24px}.team-snapshot{grid-template-columns:repeat(2,1fr)}.player-grid,.future-grid{grid-template-columns:1fr}.team-heading h1{font-size:2.2rem}}
@media(max-width:520px){main{padding-left:14px;padding-right:14px}.team-heading{align-items:flex-start;flex-direction:column}.team-mark{width:70px;height:70px}.team-snapshot{grid-template-columns:1fr 1fr}.snapshot-card{min-height:94px}.snapshot-card strong{font-size:1.25rem}}

        /* Team page UI upgrade */
        .team-page-nav{position:sticky;top:0;z-index:8;display:flex;gap:8px;padding:10px 0;margin-bottom:28px;background:linear-gradient(var(--bg),rgba(247,248,250,.92));backdrop-filter:blur(10px)}
        .team-page-nav a{padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font-size:11px;font-weight:800;text-decoration:none;transition:.2s ease}
        .team-page-nav a:hover{border-color:var(--team-colour);color:var(--text);transform:translateY(-1px)}
        .team-context-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 30px}
        .team-context-card{padding:18px;border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:0 8px 24px rgba(15,23,42,.05)}
        .team-context-card span{display:block;color:var(--text-muted);font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
        .team-context-card strong{display:block;margin-top:8px;color:var(--text);font-size:1.25rem}
        .team-context-card small{display:block;margin-top:5px;color:var(--text-muted);font-size:10px;line-height:1.45}
        .team-squad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:30px}
        .team-squad-card{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:13px;background:var(--surface);text-decoration:none;transition:.2s ease}
        .team-squad-card:hover{border-color:color-mix(in srgb,var(--team-colour) 55%,var(--border));transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.07)}
        .team-squad-rank{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--team-colour) 12%,var(--surface-soft));color:var(--team-colour);font-size:10px;font-weight:900}
        .team-squad-card strong{display:block;color:var(--text);font-size:13px}
        .team-squad-card small{display:block;margin-top:3px;color:var(--text-muted);font-size:10px}
        .team-squad-points{text-align:right}.team-squad-points strong{font-size:17px}.team-squad-points small{white-space:nowrap}
        .team-fixtures-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:30px}
        .team-fixture-card{padding:15px;border:1px solid var(--border);border-radius:13px;background:var(--surface)}
        .team-fixture-card .gw{color:var(--team-colour);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
        .team-fixture-card strong{display:block;margin-top:10px;color:var(--text);font-size:12px;line-height:1.35}
        .team-fixture-card small{display:block;margin-top:5px;color:var(--text-muted);font-size:9px}
        .team-fixture-difficulty{float:right;padding:3px 6px;border-radius:6px;background:var(--surface-soft);color:var(--text-muted);font-size:9px;font-weight:900}
        .team-section-note{margin:-6px 0 16px;color:var(--text-muted);font-size:11px;line-height:1.5}
        .team-data-empty{display:flex;gap:12px;align-items:flex-start;padding:18px;border:1px dashed var(--border);border-radius:14px;background:var(--surface-soft);color:var(--text-muted);font-size:12px;line-height:1.55}
        .team-data-empty b{color:var(--text)}
        @media(max-width:900px){.team-context-grid{grid-template-columns:repeat(2,1fr)}.team-fixtures-grid{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:650px){.team-squad-grid{grid-template-columns:1fr}.team-fixtures-grid{grid-template-columns:repeat(2,1fr)}.team-page-nav{overflow-x:auto;white-space:nowrap}.team-page-nav a{flex:0 0 auto}}
        @media(max-width:480px){.team-context-grid{grid-template-columns:1fr 1fr}.team-fixtures-grid{grid-template-columns:1fr 1fr}}
        @media(max-width:560px){
            header{padding:14px}.navbar{gap:10px}.logo{font-size:21px}
            nav{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
            nav a{padding:8px 5px;border:1px solid rgba(255,255,255,.08);border-radius:9px;text-align:center;font-size:11px}
            .theme-toggle{grid-column:span 2;width:100%;margin:0;min-height:36px}
            main{padding:20px 12px 55px}.team-hero{padding:20px 16px}.team-heading h1{font-size:2rem}
            .team-snapshot{gap:7px}.snapshot-card{padding:12px}.team-context-grid{gap:7px}
            .team-context-card{padding:13px}.team-context-card strong{font-size:1.05rem}
            .team-squad-card{grid-template-columns:30px minmax(0,1fr) auto;padding:11px;gap:8px}
            .team-fixture-card{padding:12px}
        }

        /* ScoutXI blue theme alignment for standalone profile pages */
        :root { --accent: #5b8cff; --accent-hover: #155eef; }
        body {
            background: radial-gradient(circle at 50% -10%, rgba(91, 140, 255, .075), transparent 36%), var(--bg);
        }
        .profile-shell, .team-shell, .team-hero, .team-panel, .signal-card,
        .history-panel, .fixture-panel, .stat-panel {
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        .profile-shell, .team-shell {
            border-color: color-mix(in srgb, var(--accent) 20%, var(--border));
        }
        .profile-hero, .team-hero {
            background: radial-gradient(circle at 84% 42%, rgba(91, 140, 255, .17), transparent 30%),
                        linear-gradient(135deg, #0f172a 0%, #101d35 56%, #10264b 100%);
        }
        .hero-projection { border-color: rgba(145, 181, 255, .2); background: rgba(8, 15, 28, .64); }
        .signal-card:hover, .stat-card:hover, .team-stat:hover, .team-player-card:hover {
            border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
            box-shadow: 0 12px 28px rgba(21, 94, 239, .09);
        }
        .section-heading .eyebrow, .profile-kicker, .team-kicker { color: var(--accent); }
        .profile-kicker::before { background: var(--accent); box-shadow: 0 0 0 5px rgba(91, 140, 255, .12); }
        body[data-theme="light"] .profile-hero, body[data-theme="light"] .team-hero {
            background: radial-gradient(circle at 84% 42%, rgba(91, 140, 255, .2), transparent 30%),
                        linear-gradient(135deg, #142447 0%, #18396f 100%);
        }
        body[data-theme="light"] .signal-card, body[data-theme="light"] .team-panel { background: var(--surface); }
</style>

<script>
const themeToggle=document.getElementById("theme-toggle");
const savedTheme=localStorage.getItem("fpl-theme");
document.body.dataset.theme=savedTheme==="light"?"light":"dark";
const themeLabel=themeToggle.querySelector(".theme-toggle-label");
themeLabel.textContent=document.body.dataset.theme==="light"?"Dark":"Light";
themeToggle.addEventListener("click",()=>{const isLight=document.body.dataset.theme==="light";document.body.dataset.theme=isLight?"dark":"light";localStorage.setItem("fpl-theme",document.body.dataset.theme);themeLabel.textContent=isLight?"Dark":"Light";});
const params=new URLSearchParams(window.location.search);
const requestedTeam=params.get("team");
const content=document.getElementById("team-content");

function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

const clubBadgeIds = {"Arsenal":3,"Aston Villa":7,"Bournemouth":91,"Brentford":94,"Brighton":36,"Brighton and Hove Albion":36,"Burnley":90,"Chelsea":8,"Crystal Palace":31,"Everton":11,"Fulham":54,"Leeds":2,"Leeds United":2,"Liverpool":14,"Manchester City":43,"Man City":43,"Manchester United":1,"Man Utd":1,"Newcastle":4,"Newcastle United":4,"Nottingham Forest":17,"Nott'm Forest":17,"Sunderland":56,"Tottenham":6,"Spurs":6,"West Ham":21,"Wolves":39,"Wolverhampton Wanderers":39,"Coventry City":9,"Hull City":88,"Ipswich Town":40,"Leicester City":13,"Southampton":20,"Norwich City":18};
const clubBadgeUrl = name => clubBadgeIds[String(name || "").trim()] ? "https://resources.premierleague.com/premierleague/badges/50/t" + clubBadgeIds[String(name || "").trim()] + ".png" : "";

const teamCodes={
"Arsenal":"ARS","Aston Villa":"AVL","Bournemouth":"BOU","Brentford":"BRE","Brighton":"BHA","Chelsea":"CHE","Coventry City":"COV","Crystal Palace":"CRY","Everton":"EVE","Fulham":"FUL","Hull City":"HUL","Ipswich Town":"IPS","Leeds":"LEE","Liverpool":"LIV","Man City":"MCI","Man Utd":"MUN","Newcastle":"NEW","Nott'm Forest":"NFO","Spurs":"TOT","Sunderland":"SUN"
};
const teamAccentColours={
"Arsenal":"#b3121d","Aston Villa":"#670e36","Bournemouth":"#b3121d","Brentford":"#c8102e","Brighton":"#0057b8","Chelsea":"#034694","Coventry City":"#2f6fae","Crystal Palace":"#1b458f","Everton":"#003399","Fulham":"#111111","Hull City":"#a56b00","Ipswich Town":"#0057b8","Leeds":"#1d428a","Liverpool":"#c8102e","Man City":"#1c2c5b","Man Utd":"#b91c1c","Newcastle":"#111111","Nott'm Forest":"#c81d25","Spurs":"#132257","Sunderland":"#c8102e"
};
const playerTeams={
"Hill":"Bournemouth","Wirtz":"Liverpool","Szoboszlai":"Liverpool","João Pedro":"Chelsea","Lewis-Potter":"Brentford","Palmer":"Chelsea","Saka":"Arsenal","Gabriel":"Arsenal","Dunk":"Brighton","Branthwaite":"Everton","Mykolenko":"Everton","Tarkowski":"Everton","B. Fernandes":"Man Utd","Mbeumo":"Man Utd","Rice":"Arsenal","Isak": "Liverpool","Leno":"Fulham","Bogle":"Leeds","Calvert-Lewin":"Crystal Palace","Stach":"Leeds","Haaland":"Man City","Mukiele":"Sunderland","Semenyo":"Man City","Barnes":"Newcastle","Horníček":"Hull City","Wissa":"Newcastle","Sels":"Nott'm Forest","Schlager":"Coventry City","Gibbs-White":"Nott'm Forest","Van de Ven":"Spurs","Kinsky":"Spurs","Lindelöf":"Spurs"
};

function playerAccent(name){return teamAccentColours[playerTeams[name]]||"#155eef";}

async function loadTeam(){
try{
if(!requestedTeam||!teamCodes[requestedTeam])throw new Error("Team not specified");
const [predictionResponse, profileResponse]=await Promise.all([
    fetch("predictions.json?ts="+Date.now()),
    fetch("player_profiles.json?ts="+Date.now())
]);
if(!predictionResponse.ok)throw new Error("Prediction data unavailable");
const data=await predictionResponse.json();
const profileData=profileResponse.ok?await profileResponse.json():{players:[]};
const fixture=data.predictions.find(item=>item.home===requestedTeam||item.away===requestedTeam);
if(!fixture)throw new Error("Team fixture not found");
const isHome=fixture.home===requestedTeam;
const opponent=isHome?fixture.away:fixture.home;
const picks=fixture.players.filter(player=>playerTeams[player.name]===requestedTeam).sort((a,b)=>a.rank-b.rank);
const topProjection=picks.length?Math.max(...picks.map(player=>Number(player.prediction))):0;
const combined=picks.reduce((sum,player)=>sum+Number(player.prediction),0);
const average=picks.length?combined/picks.length:0;
const opponentProjection=fixture.players.filter(player=>playerTeams[player.name]===opponent).sort((a,b)=>a.rank-b.rank);
const opponentTop=opponentProjection.length?Math.max(...opponentProjection.map(player=>Number(player.prediction))):0;
const allPlayers=Array.isArray(data.all_players)?data.all_players:[];
const allProfiles=Array.isArray(profileData.players)?profileData.players:[];
const teamProfiles=allProfiles.filter(player=>player.team===requestedTeam);
const teamPlayers=allPlayers.filter(player=>{
    const context=player.fixture_context||{};
    const home=player.fixture_home||"";
    const away=player.fixture_away||"";
    return (player.team===requestedTeam) ||
        (home===requestedTeam && context.is_home===true) ||
        (away===requestedTeam && context.is_home===false);
}).sort((a,b)=>(Number(b.prediction)||-Infinity)-(Number(a.prediction)||-Infinity));

const colour=teamAccentColours[requestedTeam];
const code=teamCodes[requestedTeam];
document.title=requestedTeam+" · ScoutXI";

content.innerHTML=
'<section class="team-hero" style="--team-colour:'+colour+'">'+
'<div class="team-copy">'+
'<div class="team-colour-line"></div>'+
'<span class="team-kicker">Gameweek '+escapeHtml(data.gameweek)+' · Team profile</span>'+
'<div class="team-heading">'+(clubBadgeUrl(requestedTeam)?'<img class="team-mark team-profile-crest" src="'+clubBadgeUrl(requestedTeam)+'" alt="'+escapeHtml(requestedTeam)+' crest" loading="lazy" onerror="this.style.display=&quot;none&quot;">':'<div class="team-mark"><span>'+code+'</span></div>')+'<h1>'+escapeHtml(requestedTeam)+'</h1></div>'+
'<p class="team-subtitle">A dedicated view of '+escapeHtml(requestedTeam)+"'s current FPL model context. The page starts with the pre-match prediction layer and is designed to become richer as live team and player data is connected.</p>"+
'<div class="team-fixture-line"><span class="fixture-pill">Current fixture</span><strong>'+escapeHtml(fixture.home)+'</strong><span>vs</span><strong>'+escapeHtml(fixture.away)+'</strong><span class="fixture-pill">'+(isHome?"Home":"Away")+'</span></div>'+
'<div class="team-status-row"><span class="team-status"><span class="team-status-dot"></span>Pre-match model</span><span class="team-status">Live data ready</span><span class="team-status">GW'+escapeHtml(data.gameweek)+'</span></div>'+
'</div>'+
'<div class="team-snapshot">'+
'<div class="snapshot-card"><span>Top team projection</span><strong>'+(picks.length?topProjection.toFixed(2):"—")+'</strong><small>Highest projection among this team’s current top-three fixture picks.</small></div>'+
'<div class="snapshot-card"><span>Top-three picks</span><strong>'+picks.length+'</strong><small>Players from this team appearing in the fixture’s model top three.</small></div>'+
'<div class="snapshot-card"><span>Combined projection</span><strong>'+(picks.length?combined.toFixed(2):"—")+'</strong><small>Sum of the team’s current top-three-listed player projections.</small></div>'+
'<div class="snapshot-card"><span>Gameweek</span><strong>GW'+escapeHtml(data.gameweek)+'</strong><small>Pre-match model snapshot. Not a live team score.</small></div>'+
'</div></section>'+
'<div class="team-page-nav" style="--team-colour:'+colour+'"><a href="#model-picks">Model picks</a><a href="#team-context">Squad snapshot</a><a href="#team-fixtures">Fixture context</a></div>'+
'<section class="section" id="model-picks" style="--team-colour:'+colour+'"><div class="section-title"><span class="eyebrow">Model picks</span><h2>Players to watch</h2><p>Players from this team who appear in the current fixture’s top-three model projections.</p></div>'+
(picks.length?'<div class="player-grid">'+picks.map((player,index)=>'<a class="player-card" style="--player-colour:'+playerAccent(player.name)+'" href="player.html?player='+encodeURIComponent(player.name)+'"><span class="player-rank">Fixture projection #'+escapeHtml(player.rank)+'</span><h3>'+escapeHtml(player.name)+'</h3><p>'+escapeHtml(requestedTeam)+' vs '+escapeHtml(opponent)+'</p><div class="player-points"><strong>'+Number(player.prediction).toFixed(2)+'</strong><span>expected points</span></div><span class="player-link">View player profile →</span></a>').join("")+'</div>':'<div class="empty">No player from '+escapeHtml(requestedTeam)+' appears in the current fixture top three. That does not mean the team has no relevant FPL options; the page is currently showing only the frozen top-three prediction layer.</div>')+
'<div class="note"><strong>How to read this:</strong> these projections describe individual player outcomes, not a predicted team score. The sections below use the published FPL/model snapshot only; they do not invent live events or team results.</div></section>'+
'<section class="section" id="team-context" style="--team-colour:'+colour+'"><div class="section-title"><span class="eyebrow">Team context</span><h2>Squad snapshot</h2><p>A compact view of the team’s modelled player pool, ownership and expected minutes.</p></div>'+
'<div class="team-context-grid">'+
'<div class="team-context-card"><span>Modelled players</span><strong id="team-player-count">—</strong><small>Players available in the current model pool.</small></div>'+
'<div class="team-context-card"><span>Average projection</span><strong id="team-average-projection">—</strong><small>Average expected points across available team players.</small></div>'+
'<div class="team-context-card"><span>Highest projection</span><strong id="team-highest-projection">—</strong><small>Highest individual projection for this fixture.</small></div>'+
'<div class="team-context-card"><span>Team xG / 90</span><strong id="team-xg">—</strong><small>Recent attacking environment used by the model.</small></div>'+
'<div class="team-context-card"><span>Opponent xGA / 90</span><strong id="team-xga">—</strong><small>Opponent defensive environment for the current fixture.</small></div>'+
'<div class="team-context-card"><span>Expected minutes</span><strong id="team-expected-minutes">—</strong><small>Average expected minutes across the top projected team players.</small></div>'+
'</div>'+
'<div id="team-squad-grid" class="team-squad-grid"></div>'+
'</section>'+
'<section class="section" id="team-fixtures" style="--team-colour:'+colour+'"><div class="section-title"><span class="eyebrow">Fixture context</span><h2>Current schedule</h2><p>The next fixture is shown from the prediction snapshot. More fixtures will appear when the published player data contains them.</p></div>'+
'<div id="team-fixtures-grid" class="team-fixtures-grid"></div>'+
'</section>';
renderTeamContext(teamPlayers, teamProfiles, fixture, data, requestedTeam, colour);
}catch(error){console.error("Team profile loading error:",error);content.innerHTML='<div class="state">This team profile is not available.</div>';}
}

function renderTeamContext(teamPlayers, teamProfiles, fixture, data, requestedTeam, colour){
    const count=document.getElementById("team-player-count");
    const avg=document.getElementById("team-average-projection");
    const high=document.getElementById("team-highest-projection");
    const xg=document.getElementById("team-xg");
    const xga=document.getElementById("team-xga");
    const mins=document.getElementById("team-expected-minutes");
    const grid=document.getElementById("team-squad-grid");
    const fixtures=document.getElementById("team-fixtures-grid");
    const valid=teamPlayers.filter(p=>Number.isFinite(Number(p.prediction)));
    count.textContent=teamPlayers.length.toLocaleString();
    avg.textContent=valid.length?(valid.reduce((sum,p)=>sum+Number(p.prediction),0)/valid.length).toFixed(2):"—";
    high.textContent=valid.length?Math.max(...valid.map(p=>Number(p.prediction))).toFixed(2):"—";
    const lead=teamPlayers.find(p=>p.fixture_context) || teamProfiles.find(p=>p.model_inputs);
    const leadContext=lead?.fixture_context || {};
    xg.textContent=Number.isFinite(Number(leadContext.team_xg_for_per90))?Number(leadContext.team_xg_for_per90).toFixed(2):"—";
    xga.textContent=Number.isFinite(Number(leadContext.opponent_xg_against_per90))?Number(leadContext.opponent_xg_against_per90).toFixed(2):"—";
    const minuteValues=teamPlayers.slice(0,5).map(p=>Number(p.expected_minutes)).filter(Number.isFinite);
    mins.textContent=minuteValues.length?(minuteValues.reduce((a,b)=>a+b,0)/minuteValues.length).toFixed(0)+" min":"—";
    grid.innerHTML=teamPlayers.slice(0,8).map((p,index)=>{
        const pos=p.position||"Player"; const mins=Number.isFinite(Number(p.expected_minutes))?Math.round(Number(p.expected_minutes))+" min":"—";
        return '<a class="team-squad-card" style="--team-colour:'+colour+'" href="player.html?player='+encodeURIComponent(p.name)+'"><span class="team-squad-rank">'+(index+1)+'</span><span><strong>'+escapeHtml(p.name)+'</strong><small>'+escapeHtml(pos)+' · '+mins+' · '+(Number.isFinite(Number(p.ownership))?Number(p.ownership).toFixed(1)+"% owned":"ownership —")+'</small></span><span class="team-squad-points"><strong>'+ (Number.isFinite(Number(p.prediction))?Number(p.prediction).toFixed(2):"—")+'</strong><small>expected pts</small></span></a>';}).join("") || '<div class="team-data-empty"><b>No squad rows</b><span>The published model snapshot does not currently contain player rows for this team.</span></div>';
    const fixtureSource=teamProfiles.find(p=>Array.isArray(p.next_fixtures)&&p.next_fixtures.length)?.next_fixtures || [];
    const future=[{gw:data.gameweek,opponent:requestedTeam===fixture.home?fixture.away:fixture.home,is_home:requestedTeam===fixture.home,difficulty:null,kickoff:fixture.kickoff,home:fixture.home,away:fixture.away}, ...fixtureSource.filter(item=>String(item.gw)!==String(data.gameweek))].slice(0,5);
    fixtures.innerHTML=future.map(item=>{
        const opponentText=item.opponent || (item.is_home?item.away:item.home) || "—";
        return '<div class="team-fixture-card" style="--team-colour:'+colour+'"><span class="gw">GW'+escapeHtml(item.gw)+'</span><span class="team-fixture-difficulty">'+(item.difficulty!=null?"D"+item.difficulty:"Current")+'</span><strong>'+escapeHtml(opponentText)+'</strong><small>'+escapeHtml(item.is_home?"Home":"Away")+(item.kickoff?' · '+new Date(item.kickoff).toLocaleDateString([], {day:"numeric",month:"short"}):"")+'</small></div>';
    }).join("");
}

loadTeam();
</script>

<script>
/* Lightweight scroll-in motion; respects reduced-motion preferences and supports dynamic content. */
(function(){
  if(!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const selector=".section,.section-title,.hero-stat,.prediction-card,.fixture-card,.player-card,.panel-surface,.player-compare-shell,.prediction-overview,.overview-stat,.overview-intro,.builder-ai-card,.snapshot-card,.team-hero,.profile-shell";
  const seen=new WeakSet();
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:0.08,rootMargin:"0px 0px -35px 0px"});
  function prepare(root){
    if(root.nodeType!==1) return;
    if(root.matches(selector) && !seen.has(root)){
      seen.add(root);
      root.classList.add("scroll-reveal");
      observer.observe(root);
    }
    root.querySelectorAll?.(selector).forEach(el=>{
      if(seen.has(el)) return;
      seen.add(el);
      el.classList.add("scroll-reveal");
      observer.observe(el);
    });
  }
  prepare(document.documentElement);
  new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(prepare))).observe(document.body,{childList:true,subtree:true});
})();
</script>
