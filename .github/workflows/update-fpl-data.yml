name: Update FPL website data

on:
  push:
    paths:
      - "model/**"
      - ".github/workflows/update-fpl-data.yml"
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Gameweek to prepare (leave blank to auto-detect the next unstarted gameweek)"
        required: false
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: fpl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target gameweek
        id: gw
        shell: bash
        env:
          REQUESTED_GAMEWEEK: ${{ inputs.gameweek }}
        run: |
          if [ -n "$REQUESTED_GAMEWEEK" ]; then
            GAMEWEEK="$REQUESTED_GAMEWEEK"
          else
            GAMEWEEK="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          url = "https://fantasy.premierleague.com/api/bootstrap-static/"
          request = Request(url, headers={"User-Agent": "AI-FPL-Predictor/1.0"})
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)

          now = datetime.now(timezone.utc)
          upcoming = []
          for event in payload.get("events", []):
              deadline = event.get("deadline_time")
              if event.get("finished") or not deadline:
                  continue
              deadline_dt = datetime.fromisoformat(deadline.replace("Z", "+00:00"))
              if deadline_dt > now:
                  upcoming.append((deadline_dt, event["id"]))

          if not upcoming:
              raise SystemExit("Could not find a future, unstarted FPL gameweek; refusing to publish stale predictions.")

          print(min(upcoming)[1])
          PY
          )"
          fi

          if ! [[ "$GAMEWEEK" =~ ^[0-9]+$ ]] || [ "$GAMEWEEK" -lt 1 ] || [ "$GAMEWEEK" -gt 38 ]; then
            echo "Invalid gameweek: '$GAMEWEEK' (expected 1-38)." >&2
            exit 1
          fi
          echo "Resolved target Gameweek $GAMEWEEK"
          echo "gameweek=$GAMEWEEK" >> "$GITHUB_OUTPUT"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Preserve previous predictions for audit
        run: |
          if [ -f predictions.json ]; then
            cp predictions.json predictions.previous.json
          fi

      - name: Generate model predictions
        run: |
          python model/update_predictions.py --gameweek "${{ steps.gw.outputs.gameweek }}" --output predictions.generated.json

      - name: Audit prediction changes
        run: |
          python model/audit_prediction_changes.py \
            --previous predictions.previous.json \
            --current predictions.generated.json \
            --output prediction_audit.json

      - name: Generate live intelligence dataset
        run: |
          python model/build_live_data.py --gameweek "${{ steps.gw.outputs.gameweek }}" --predictions predictions.generated.json --output live_data.json

      - name: Publish generated prediction data
        run: mv predictions.generated.json predictions.json

      - name: Update prediction history
        run: |
          python model/publish_prediction_history.py \
            --predictions predictions.json \
            --history prediction_history.json

      - name: Measure latest realized prediction accuracy
        shell: bash
        run: |
          GW="${{ steps.gw.outputs.gameweek }}"
          if [ "$GW" -gt 1 ]; then
            python model/measure_prediction_accuracy.py \
              --history prediction_history.json \
              --gameweek "$((GW - 1))" \
              --output prediction_accuracy.json
          else
            printf '{"available":false,"reason":"no completed gameweek yet}\n' > prediction_accuracy.json
          fi

      - name: Update accuracy trend history
        run: |
          python model/publish_accuracy_history.py \
            --result prediction_accuracy.json \
            --history prediction_accuracy_history.json

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          predictions = json.loads(Path("predictions.json").read_text(encoding="utf-8"))
          players = predictions.get("all_players", [])
          assert len(players) >= 30, f"Expected at least 30 player predictions, got {len(players)}"
          required = {
              "prediction", "prediction_p10", "prediction_p90",
              "prediction_range", "confidence", "expected_minutes",
              "fixture_difficulty", "fixture_home", "fixture_away",
          }
          for player in players:
              missing = required - set(player)
              assert not missing, f"{player.get('name', 'Unknown')} missing fields: {sorted(missing)}"
              low, point, high = (float(player[k]) for k in
                                  ("prediction_p10", "prediction", "prediction_p90"))
              assert all(math.isfinite(v) for v in (low, point, high)), player.get("name")
              assert low <= point <= high, player.get("name")
              assert 1 <= int(player["fixture_difficulty"]) <= 5, player.get("name")

          live = json.loads(Path("live_data.json").read_text(encoding="utf-8"))
          assert len(live.get("players", [])) >= 30, "Live dataset has too few players"
          profiles = json.loads(Path("player_profiles.json").read_text(encoding="utf-8"))
          assert len(profiles.get("players", [])) >= 30, "Player profile dataset has too few players"
          fixture_data = json.loads(Path("fixture_difficulty.json").read_text(encoding="utf-8"))
          ranked_teams = fixture_data.get("teams", [])
          assert len(ranked_teams) == 20, f"Expected fixture schedules for 20 clubs, got {len(ranked_teams)}"
          for team in ranked_teams:
              assert team.get("fixtures"), f"No upcoming fixtures for {team.get('team')}"
              for fixture in team["fixtures"]:
                  rating = fixture.get("difficulty")
                  assert rating is None or 1 <= int(rating) <= 5, f"Invalid FDR for {team.get('team')}"
                  assert fixture.get("source") in {"official_fpl", "model_estimate", "unavailable"}, f"Unknown FDR source: {fixture.get('source')}"
          print(f"Validated {len(players)} player predictions, {len(live['players'])} live player records and {len(ranked_teams)} fixture schedules.")
          PY

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.json live_data.json differentials.json player_profiles.json prediction_history.json prediction_audit.json prediction_accuracy.json prediction_accuracy_history.json fixture_difficulty.json index.html
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update Gameweek ${{ steps.gw.outputs.gameweek }} predictions and player data"
          # UI commits can land while this long-running model job is generating data.
          # Rebase the generated-data commit onto the latest main before pushing so
          # the data refresh does not fail solely because main advanced meanwhile.
          git fetch origin main
          git rebase origin/main
          git push
