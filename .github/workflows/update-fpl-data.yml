name: Update FPL website data

on:
  push:
    paths:
      - "model/**"
      - ".github/workflows/update-fpl-data.yml"
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Gameweek to prepare"
        required: true
        default: "6"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target gameweek
        id: gw
        shell: bash
        run: |
          echo "gameweek=${{ inputs.gameweek || '6' }}" >> "$GITHUB_OUTPUT"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Preserve previous predictions for model audit\n        run: |\n          if [ -f predictions.json ]; then cp predictions.json predictions.previous.json; fi\n\n      - name: Generate model predictions\n        run: |
          python model/update_predictions.py --gameweek "${{ steps.gw.outputs.gameweek }}" --output predictions.generated.json

      - name: Audit prediction changes\n        run: |\n          python model/audit_prediction_changes.py \\\n            --previous predictions.previous.json \\\n            --current predictions.generated.json \\\n            --output prediction_audit.json\n\n      - name: Generate live intelligence dataset\n        run: |
          python model/build_live_data.py --gameweek "${{ steps.gw.outputs.gameweek }}" --predictions predictions.generated.json --output live_data.json

      - name: Publish generated prediction data
        run: mv predictions.generated.json predictions.json

      - name: Update prediction history
        run: |
          python model/publish_prediction_history.py \
            --predictions predictions.json \
            --history prediction_history.json

      - name: Measure latest realized prediction accuracy
        run: |
          GW="${{ steps.gw.outputs.gameweek }}"
          if [ "$GW" -gt 1 ]; then
            python model/measure_prediction_accuracy.py \
              --history prediction_history.json \
              --gameweek "$((GW - 1))" \
              --output prediction_accuracy.json
          else
            printf '{"available":false,"reason":"no completed gameweek yet"}\n' > prediction_accuracy.json
          fi

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.json live_data.json differentials.json player_profiles.json prediction_history.json prediction_audit.json prediction_accuracy.json index.html
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update live FPL predictions and statistics"
          git push
