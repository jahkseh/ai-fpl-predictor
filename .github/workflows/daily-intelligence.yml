name: ScoutXI Daily Intelligence Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'model/build_intelligence_snapshot.py'
      - '.github/workflows/daily-intelligence.yml'
  schedule:
    # 08:00 UTC. GitHub cron uses UTC, so this is 08:00 UK in winter and
    # 09:00 UK during British Summer Time; DST-aware scheduling is a later option.
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: scoutxi-daily-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and validate public FPL intelligence
        run: python model/build_intelligence_snapshot.py
      - name: Check snapshot schema and freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path("intelligence_snapshot.json").read_text(encoding="utf-8"))
          required = {"schema_version", "collected_at", "sources", "coverage", "players", "fixtures"}
          missing = required - data.keys()
          if missing:
              raise SystemExit(f"Snapshot missing required fields: {sorted(missing)}")
          if not data["players"]:
              raise SystemExit("Snapshot contains no players")
          if not data["fixtures"]:
              raise SystemExit("Snapshot contains no fixtures")
          if not data["sources"] or any(source.get("status") != "ok" for source in data["sources"]):
              raise SystemExit("One or more data sources failed")
          # These keys must exist even when the official API omits a value.
          required_player_fields = {
              "id", "name", "expected_goals", "expected_assists",
              "expected_goal_involvements"
          }
          missing_player_fields = {
              field for player in data["players"]
              for field in required_player_fields - player.keys()
          }
          if missing_player_fields:
              raise SystemExit(
                  f"Player records missing expected fields: {sorted(missing_player_fields)}"
              )
          has_xg_xa = any(
              player.get("expected_goals") is not None
              or player.get("expected_assists") is not None
              for player in data["players"]
          )
          if bool(data["coverage"].get("expected_goals_data")) != has_xg_xa:
              raise SystemExit("xG/xA coverage flag does not match populated player fields")
          if data["coverage"].get("players") != len(data["players"]):
              raise SystemExit("Player coverage count does not match snapshot")
          if data["coverage"].get("fixtures") != len(data["fixtures"]):
              raise SystemExit("Fixture coverage count does not match snapshot")
          collected = datetime.fromisoformat(data["collected_at"].replace("Z", "+00:00"))
          age_seconds = (datetime.now(timezone.utc) - collected).total_seconds()
          if age_seconds < -60 or age_seconds > 600:
              raise SystemExit(f"Unexpected snapshot timestamp age: {age_seconds:.0f}s")
          print(f"Validated snapshot: {len(data['players'])} players, {len(data['fixtures'])} fixtures")
          PY
      - name: Commit updated intelligence snapshot
        run: |
          # git diff ignores untracked files; use git status so the first
          # generated snapshot is committed as well as later tracked updates.
          if [ -z "$(git status --porcelain -- intelligence_snapshot.json)" ]; then
            echo "Snapshot unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence_snapshot.json
          git commit -m "Refresh daily ScoutXI intelligence snapshot"
          git push
