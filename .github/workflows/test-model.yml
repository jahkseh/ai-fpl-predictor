name: Test FPL model

on:
  push:
    paths:
      - "model/**"
      - "predictions.json"
      - "index.html"
      - "player.html"
      - ".github/workflows/test-model.yml"
  pull_request:
    paths:
      - "model/**"
      - "predictions.json"
      - "index.html"
      - "player.html"
      - ".github/workflows/test-model.yml"
  workflow_dispatch:

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Run Phase 3/4 walk-forward backtest
        run: |
          python model/phase3_backtest.py --output phase3_backtest.json

      - name: Validate production prediction pipeline
        run: |
          python model/update_predictions.py --gameweek 6 --output predictions.ci.json

      - name: Validate live intelligence and differential publishing
        run: |
          python model/build_live_data.py --gameweek 6 --predictions predictions.ci.json --output live_data.ci.json
          python - <<'PY'
          import json
          from pathlib import Path

          predictions = json.loads(Path("predictions.ci.json").read_text(encoding="utf-8"))
          all_players = predictions.get("all_players", [])
          assert len(all_players) >= 30
          required_model_fields = {
              "prediction", "prediction_p10", "prediction_p90",
              "prediction_range", "confidence", "expected_minutes",
              "fixture_difficulty", "fixture_home", "fixture_away",
          }
          assert required_model_fields.issubset(all_players[0]), "Full player model payload is missing fields"
          assert all(
              0 <= float(player["prediction_p10"]) <= float(player["prediction"]) <= float(player["prediction_p90"])
              for player in all_players
          )
          assert all(1 <= int(player["fixture_difficulty"]) <= 5 for player in all_players)

          live = json.loads(Path("live_data.ci.json").read_text(encoding="utf-8"))
          modelled = [player for player in live["players"] if player.get("prediction") is not None]
          assert len(modelled) >= 30
          assert all(player.get("expected_minutes") is not None for player in modelled)
          assert all(player.get("prediction_p10") is not None and player.get("prediction_p90") is not None for player in modelled)

          profiles = json.loads(Path("player_profiles.json").read_text(encoding="utf-8"))
          assert len(profiles["players"]) >= 30
          assert all(
              {"model_inputs", "recent_form", "underlying", "historical_record", "next_fixtures", "why"}.issubset(player)
              and len(player["recent_form"]) <= 5
              and len(player["next_fixtures"]) <= 5
              and len(player["why"]) == 8
              and isinstance(player["historical_record"].get("seasons"), list)
              for player in profiles["players"]
          )
          assert any(
              player["name"] == "Mbeumo"
              and len(player["historical_record"].get("seasons", [])) >= 1
              for player in profiles["players"]
          )

          data = json.loads(Path("differentials.json").read_text(encoding="utf-8"))
          assert len(data["picks"]) == 5
          assert all(0 <= float(p["ownership"]) <= 10 for p in data["picks"])

          html = Path("index.html").read_text(encoding="utf-8")
          assert "<!-- DIFFERENTIAL_CARDS_START -->" in html
          assert "<!-- DIFFERENTIAL_CARDS_END -->" in html
          assert html.count('class="differential-card"') >= 5
          assert "Loading picks" not in html
          assert 'id="live-team-filter"' in html
          assert 'id="live-max-price"' in html
          assert 'id="live-min-minutes"' in html
          assert 'P10–P90' in html
          assert "Search for a player or add a filter" in html
          assert 'Array.isArray(predictionData.all_players)' in html
          assert 'const predictionResponse = await fetch("predictions.json?ts=" + Date.now())' in html
          player_html = Path("player.html").read_text(encoding="utf-8")
          assert "player_profiles.json" in player_html
          assert "Deterministic model explanation" in player_html
          assert "Why is the model predicting this?" in player_html
          assert "Performance signals" in player_html
          assert "ICT / 90" in player_html
          assert "BPS / 90" in player_html
          print("Live intelligence, filters, player profiles and differential publishing validation passed.")
          PY

      - name: Validate generated backtest artifact
        run: |
          python - <<'PY'
          import json
          with open("phase3_backtest.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["models"]["baseline"]
          assert data["models"]["phase3"]
          assert data["models"]["phase4"]
          assert "prior completed seasons" in data["evaluation"]
          assert data["feature_count"]["phase3"] > data["feature_count"]["baseline"]
          assert len(data["gameweeks_evaluated"]) >= 10
          print("Phase 3 backtest validation passed.")
          PY
