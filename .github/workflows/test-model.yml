name: Test FPL model

on:
  push:
    paths:
      - "model/**"
      - "predictions.json"
      - ".github/workflows/test-model.yml"
  workflow_dispatch:

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Run Phase 3 walk-forward backtest
        run: |
          python model/phase3_backtest.py --output phase3_backtest.json

      - name: Validate production prediction pipeline
        run: |
          python model/update_predictions.py             --gameweek 6             --dry-run

      - name: Validate generated backtest artifact
        run: |
          python - <<'PY'
          import json
          with open("phase3_backtest.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["models"]["baseline"]
          assert data["models"]["phase3"]
          assert len(data["gameweeks_evaluated"]) >= 10
          print("Phase 3 backtest validation passed.")
          PY
