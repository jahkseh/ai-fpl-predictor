name: Test FPL model

on:
  push:
    paths:
      - "model/**"
      - "predictions.json"
      - ".github/workflows/test-model.yml"
  workflow_dispatch:

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Run GW5 golden regression
        run: |
          python model/update_predictions.py \
            --gameweek 5 \
            --golden predictions.json \
            --dry-run
